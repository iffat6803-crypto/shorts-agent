      - name: Upload GitHub artifact backup
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: final-short-${{ github.run_id }}

          path: |
            final-short.mp4
            out/base-final.mp4
            out/captions.srt
            out/section_*.wav
            out/source_*.jpg
            out/source_*.mp4
            out/scenes/*.mp4

          if-no-files-found: warn

          retention-days: 7
