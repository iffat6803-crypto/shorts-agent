name: Shorts Production Render

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Video niche"
        required: false
        default: "science"
        type: choice
        options:
          - science
          - technology
          - history
          - wars

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. SETUP
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" soundfile numpy requests

      # ============================================================
      # 2. NICHE
      # ============================================================

      - name: Set niche
        run: |
          NICHE="${{ github.event.inputs.niche }}"

          if [ -z "$NICHE" ]; then
            NICHE="science"
          fi

          case "$NICHE" in
            science|technology|history|wars)
              ;;
            *)
              echo "Invalid niche: $NICHE"
              exit 1
              ;;
          esac

          echo "NICHE=$NICHE" >> "$GITHUB_ENV"

          echo "================================"
          echo "Selected niche: $NICHE"
          echo "================================"

      # ============================================================
      # 3. CREATE SCENE-BASED SCRIPT
      # ============================================================

      - name: Create scene script
        run: |
          mkdir -p scenes

          cat > create_scenes.py <<'PY'
          import json
          import os

          niche = os.environ["NICHE"]

          scripts = {

              "science": [
                  {
                      "text": "Something in deep space is sending a signal that scientists still cannot fully explain.",
                      "query": "deep space galaxy telescope stars"
                  },
                  {
                      "text": "The strange part is not simply that the signal exists.",
                      "query": "radio telescope astronomy observatory"
                  },
                  {
                      "text": "It appears again and again in a pattern that has caught researchers' attention.",
                      "query": "astronomy scientist telescope research"
                  },
                  {
                      "text": "Astronomers are studying the signal to understand what kind of object could be producing it.",
                      "query": "astronomer scientist laboratory space research"
                  },
                  {
                      "text": "And there is an important detail: this does not mean scientists have discovered aliens.",
                      "query": "space telescope night sky stars"
                  },
                  {
                      "text": "It means something in the universe is behaving in a way that our current explanations may not completely describe.",
                      "query": "mysterious space galaxy universe"
                  },
                  {
                      "text": "That is why unusual signals matter: sometimes the strangest observations become the clues that lead to the next discovery.",
                      "query": "scientist looking telescope discovery space"
                  }
              ],

              "technology": [
                  {
                      "text": "The technology that looks impossible today could become completely normal sooner than you think.",
                      "query": "future technology artificial intelligence computer"
                  },
                  {
                      "text": "Artificial intelligence is already moving beyond simple chat and search.",
                      "query": "artificial intelligence computer technology"
                  },
                  {
                      "text": "Modern systems can analyze images, understand speech, generate content, and help solve complicated problems.",
                      "query": "AI technology computer screen laboratory"
                  },
                  {
                      "text": "The surprising part is how quickly these abilities are improving.",
                      "query": "technology innovation futuristic computer"
                  },
                  {
                      "text": "A capability that seems advanced today can become an ordinary tool surprisingly fast.",
                      "query": "modern technology smartphone computer"
                  },
                  {
                      "text": "That creates a bigger question: which jobs and industries will change first?",
                      "query": "future workplace technology people computers"
                  },
                  {
                      "text": "The answer is still developing, but one thing is clear: the technology race is moving faster than most people realize.",
                      "query": "future technology city digital innovation"
                  }
              ],

              "history": [
                  {
                      "text": "One small decision in history can sometimes change the future of millions of people.",
                      "query": "ancient history old documents civilization"
                  },
                  {
                      "text": "What looks like a minor event at the time can become the beginning of a much larger chain of consequences.",
                      "query": "historical documents old map archive"
                  },
                  {
                      "text": "Leaders make decisions, nations react, and those reactions create new decisions.",
                      "query": "historical leader painting parliament history"
                  },
                  {
                      "text": "Wars, inventions, discoveries, and political changes are often connected in ways that are easy to miss.",
                      "query": "history war invention old photographs"
                  },
                  {
                      "text": "That is why historians do more than memorize dates.",
                      "query": "historian studying old books archive"
                  },
                  {
                      "text": "They look for the connections between events and ask what caused one moment to lead to another.",
                      "query": "historian research historical documents"
                  },
                  {
                      "text": "And sometimes, following one tiny clue can completely change how we understand the past.",
                      "query": "ancient artifact archaeological discovery"
                  }
              ],

              "wars": [
                  {
                      "text": "Some famous battles were not decided by the strongest army.",
                      "query": "historical battlefield soldiers military"
                  },
                  {
                      "text": "They were decided by information, timing, geography, and the decisions made before the fighting even began.",
                      "query": "military strategy map planning"
                  },
                  {
                      "text": "An army can have more soldiers and better equipment and still lose if its supply lines collapse.",
                      "query": "military logistics historical army supplies"
                  },
                  {
                      "text": "Communication can be just as important as weapons because commanders need to know what is happening in real time.",
                      "query": "military communication radio soldiers"
                  },
                  {
                      "text": "A single tactical mistake can then turn a difficult battle into a disaster.",
                      "query": "historical battle soldiers battlefield"
                  },
                  {
                      "text": "That is why military history is really a study of decisions, preparation, information, and adaptation.",
                      "query": "military commander map strategy history"
                  },
                  {
                      "text": "The battlefield shows the result, but the decisions made before it often explain why the result happened.",
                      "query": "historical military map battlefield"
                  }
              ]
          }

          scenes = scripts[niche]

          with open("scenes.json", "w", encoding="utf-8") as f:
              json.dump(scenes, f, indent=2, ensure_ascii=False)

          print(f"Created {len(scenes)} scenes for {niche}")

          for i, scene in enumerate(scenes, 1):
              print(f"{i}: {scene['text']}")
              print(f"   visual: {scene['query']}")
          PY

          python create_scenes.py

      # ============================================================
      # 4. GENERATE VOICE FOR EVERY SCENE
      # ============================================================

      - name: Generate scene voices
        run: |
          cat > generate_voices.py <<'PY'
          import json
          import os
          import numpy as np
          import soundfile as sf
          from kokoro import KPipeline

          scenes = json.load(open("scenes.json", encoding="utf-8"))

          os.makedirs("audio", exist_ok=True)

          pipeline = KPipeline(lang_code="a")

          for index, scene in enumerate(scenes, 1):

              text = scene["text"].strip()

              print(f"Generating voice for scene {index}")
              print(text)

              chunks = []

              for _, _, audio in pipeline(
                  text,
                  voice="af_heart",
                  speed=1.0
              ):
                  chunks.append(audio)

              if not chunks:
                  raise SystemExit(
                      f"ERROR: Kokoro produced no audio for scene {index}"
                  )

              audio = np.concatenate(chunks)

              output = f"audio/scene_{index:02d}.wav"

              sf.write(
                  output,
                  audio,
                  24000
              )

              duration = len(audio) / 24000

              scene["audio"] = output
              scene["duration"] = duration

              print(
                  f"Scene {index} duration: "
                  f"{duration:.2f}s"
              )

          with open(
              "scenes_with_audio.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  scenes,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          total = sum(
              scene["duration"]
              for scene in scenes
          )

          print(
              f"TOTAL VOICE DURATION: "
              f"{total:.2f}s"
          )

          if total < 30:
              raise SystemExit(
                  "ERROR: Final narration is under 30 seconds"
              )
          PY

          python generate_voices.py

      # ============================================================
      # 5. DOWNLOAD ONE RELEVANT PEXELS VIDEO PER SCENE
      # ============================================================

      - name: Download scene visuals
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "ERROR: PEXELS_API_KEY secret is missing"
            exit 1
          fi

          mkdir -p clips

          cat > download_pexels.py <<'PY'
          import json
          import os
          import subprocess
          import requests

          API_KEY = os.environ["PEXELS_API_KEY"]

          scenes = json.load(
              open(
                  "scenes_with_audio.json",
                  encoding="utf-8"
              )
          )

          headers = {
              "Authorization": API_KEY
          }

          for index, scene in enumerate(scenes, 1):

              query = scene["query"]

              print()
              print("=" * 60)
              print(f"Scene {index}")
              print(f"Query: {query}")
              print("=" * 60)

              response = requests.get(
                  "https://api.pexels.com/v1/videos/search",
                  headers=headers,
                  params={
                      "query": query,
                      "orientation": "portrait",
                      "size": "medium",
                      "per_page": 10
                  },
                  timeout=30
              )

              response.raise_for_status()

              data = response.json()

              videos = data.get("videos", [])

              if not videos:
                  raise SystemExit(
                      f"ERROR: No Pexels videos found for scene {index}: {query}"
                  )

              selected = None

              # Prefer portrait videos.
              for video in videos:

                  files = [
                      f
                      for f in video.get("video_files", [])
                      if f.get("link")
                      and f.get("width", 0) > 0
                      and f.get("height", 0) > 0
                  ]

                  portrait = [
                      f
                      for f in files
                      if f.get("height", 0) >= f.get("width", 0)
                  ]

                  if portrait:
                      selected = max(
                          portrait,
                          key=lambda x:
                          x.get("width", 0)
                          * x.get("height", 0)
                      )
                      break

              # Fallback to any usable video.
              if selected is None:

                  for video in videos:

                      files = [
                          f
                          for f in video.get("video_files", [])
                          if f.get("link")
                          and f.get("width", 0) > 0
                          and f.get("height", 0) > 0
                      ]

                      if files:
                          selected = max(
                              files,
                              key=lambda x:
                              x.get("width", 0)
                              * x.get("height", 0)
                          )
                          break

              if selected is None:
                  raise SystemExit(
                      f"ERROR: No usable Pexels file for scene {index}"
                  )

              url = selected["link"]

              output = (
                  f"clips/scene_{index:02d}.mp4"
              )

              print(
                  f"Downloading "
                  f"{selected.get('width')}x"
                  f"{selected.get('height')}"
              )

              subprocess.run(
                  [
                      "curl",
                      "-fL",
                      "--retry",
                      "3",
                      "--connect-timeout",
                      "20",
                      "--max-time",
                      "120",
                      url,
                      "-o",
                      output
                  ],
                  check=True
              )

              if not os.path.exists(output):
                  raise SystemExit(
                      f"ERROR: Download failed for scene {index}"
                  )

              if os.path.getsize(output) < 10000:
                  raise SystemExit(
                      f"ERROR: Downloaded clip is invalid for scene {index}"
                  )

              scene["video"] = output

          with open(
              "scenes_final.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  scenes,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print()
          print("All scene visuals downloaded successfully.")
          PY

          python download_pexels.py

      # ============================================================
      # 6. CREATE EACH SCENE VIDEO
      #    VISUAL DURATION = EXACT AUDIO DURATION
      # ============================================================

      - name: Build synchronized scenes
        run: |
          mkdir -p rendered_scenes

          cat > build_scenes.py <<'PY'
          import json
          import os
          import subprocess

          scenes = json.load(
              open(
                  "scenes_final.json",
                  encoding="utf-8"
              )
          )

          for index, scene in enumerate(scenes, 1):

              video = scene["video"]
              audio = scene["audio"]
              duration = float(scene["duration"])

              output = (
                  f"rendered_scenes/scene_{index:02d}.mp4"
              )

              print(
                  f"Rendering scene {index}: "
                  f"{duration:.2f}s"
              )

              command = [
                  "ffmpeg",
                  "-y",

                  "-stream_loop",
                  "-1",
                  "-i",
                  video,

                  "-i",
                  audio,

                  "-t",
                  str(duration),

                  "-vf",
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920",

                  "-map",
                  "0:v:0",

                  "-map",
                  "1:a:0",

                  "-c:v",
                  "libx264",

                  "-preset",
                  "veryfast",

                  "-crf",
                  "23",

                  "-pix_fmt",
                  "yuv420p",

                  "-c:a",
                  "aac",

                  "-b:a",
                  "128k",

                  "-ar",
                  "48000",

                  "-shortest",

                  "-movflags",
                  "+faststart",

                  output
              ]

              subprocess.run(
                  command,
                  check=True
              )

              if not os.path.exists(output):
                  raise SystemExit(
                      f"ERROR: Scene {index} was not rendered"
                  )

          print("All scenes rendered successfully.")
          PY

          python build_scenes.py

      # ============================================================
      # 7. CREATE EXACT SUBTITLES
      # ============================================================

      - name: Create synchronized subtitles
        run: |
          python - <<'PY'
          import json

          scenes = json.load(
              open(
                  "scenes_final.json",
                  encoding="utf-8"
              )
          )

          def timestamp(seconds):
              milliseconds = int(
                  round(seconds * 1000)
              )

              hours = milliseconds // 3600000
              milliseconds %= 3600000

              minutes = milliseconds // 60000
              milliseconds %= 60000

              seconds = milliseconds // 1000
              milliseconds %= 1000

              return (
                  f"{hours:02}:"
                  f"{minutes:02}:"
                  f"{seconds:02},"
                  f"{milliseconds:03}"
              )

          current = 0.0

          with open(
              "subtitles.srt",
              "w",
              encoding="utf-8"
          ) as f:

              subtitle_number = 1

              for scene in scenes:

                  start = current
                  end = (
                      current +
                      float(scene["duration"])
                  )

                  text = scene["text"].strip()

                  f.write(
                      f"{subtitle_number}\n"
                  )

                  f.write(
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                  )

                  f.write(
                      f"{text}\n\n"
                  )

                  subtitle_number += 1
                  current = end

          print(
              f"Created {subtitle_number - 1} "
              f"subtitle blocks."
          )

          print(
              f"Subtitle duration: "
              f"{current:.2f}s"
          )
          PY

      # ============================================================
      # 8. CONCATENATE ALL SCENES
      # ============================================================

      - name: Create concat list
        run: |
          rm -f concat.txt

          for file in rendered_scenes/scene_*.mp4; do
            echo "file '$PWD/$file'" >> concat.txt
          done

          cat concat.txt

      - name: Concatenate scenes
        run: |
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            combined.mp4

          test -s combined.mp4

      # ============================================================
      # 9. FINAL MASTER VIDEO + SUBTITLES
      # ============================================================

      - name: Render final Short
        run: |

          ffmpeg -y \
            -i combined.mp4 \
            -vf "subtitles=subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=120'" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            final-short.mp4

          test -s final-short.mp4

      # ============================================================
      # 10. VALIDATE EVERYTHING
      # ============================================================

      - name: Validate final video
        run: |

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final-short.mp4)

          WIDTH=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            final-short.mp4)

          HEIGHT=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            final-short.mp4)

          SIZE=$(stat -c%s final-short.mp4)

          echo "================================"
          echo "FINAL VIDEO CHECK"
          echo "Duration: ${DURATION}s"
          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "Size: ${SIZE} bytes"
          echo "================================"

          test -s final-short.mp4

          python - "$DURATION" "$WIDTH" "$HEIGHT" <<'PY'
          import sys

          duration = float(sys.argv[1])
          width = int(sys.argv[2])
          height = int(sys.argv[3])

          if duration < 30:
              raise SystemExit(
                  f"ERROR: Final video is only "
                  f"{duration:.2f}s. Minimum is 30s."
              )

          if width != 1080 or height != 1920:
              raise SystemExit(
                  f"ERROR: Wrong resolution: "
                  f"{width}x{height}. "
                  f"Expected 1080x1920."
              )

          print(
              f"Duration OK: {duration:.2f}s"
          )

          print(
              f"Resolution OK: "
              f"{width}x{height}"
          )

          print(
              "No maximum duration limit enforced."
          )
          PY

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            final-short.mp4

      # ============================================================
      # 11. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload final Short
        uses: actions/upload-artifact@v4
        with:
          name: final-short-${{ github.run_id }}
          path: |
            final-short.mp4
            subtitles.srt
            scenes_final.json
          retention-days: 7
