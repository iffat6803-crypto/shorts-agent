name: Render Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run ID"
        required: true
        type: string
      topic:
        description: "Video topic"
        required: true
        type: string
      script:
        description: "Complete narration script"
        required: true
        type: string
      title:
        description: "Video title"
        required: true
        type: string
      visuals:
        description: "JSON array of per-section visual assets"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pip fonts-dejavu-core wget libass-dev

      - name: Install Python packages
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir "kokoro>=0.9.4" soundfile numpy torch google-api-python-client

      - name: Render Short
        env:
          RUN_ID: ${{ inputs.run_id }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}
        run: |
          set -euo pipefail
          
          # Download Background Music
          wget -O bg_music.mp3 "https://www.chosic.com/wp-content/uploads/2021/04/The-Enigma-TNG-The-Deep-Web.mp3" || touch bg_music.mp3

          cat > render.py <<'PY'
          import json, os, pathlib, subprocess, urllib.request, numpy as np, soundfile as sf, random
          from kokoro import KPipeline

          OUT = pathlib.Path("out")
          OUT.mkdir(parents=True, exist_ok=True)
          SCENES_DIR = OUT / "scenes"
          SCENES_DIR.mkdir(parents=True, exist_ok=True)
          SAMPLE_RATE, OUTPUT_AUDIO_RATE, FPS = 24000, 48000, 30

          def get_duration(path):
              res = subprocess.check_output(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", str(path)], text=True).strip()
              return float(res)

          def download_visual(url, dest_base):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  ctype = resp.headers.get("Content-Type", "").lower()
                  data = resp.read()
                  ext = ".mp4" if "video" in ctype else ".jpg"
                  dest = dest_base.with_suffix(ext)
                  with open(dest, "wb") as f: f.write(data)
              return dest, "video" in ctype

          def create_ass(words, dur, output_path):
              header = (
                  "[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\n\n"
                  "[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
                  "Style: Default,DejaVu Sans,110,&H00FFFFFF,&H0000FFFF,&H00000000,&H00000000,-1,0,0,0,100,100,0,0,1,6,0,5,50,50,960,1\n\n"
                  "[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              )
              with open(output_path, "w") as f:
                  f.write(header)
                  word_dur = dur / len(words)
                  current_time = 0
                  for word in words:
                      start_ts = f"{int(current_time//3600):01}:{int((current_time%3600)//60):02}:{current_time%60:05.2f}"
                      end_time = current_time + word_dur
                      end_ts = f"{int(end_time//3600):01}:{int((end_time%3600)//60):02}:{end_time%60:05.2f}"
                      f.write(f"Dialogue: 0,{start_ts},{end_ts},Default,,0,0,0,,{{\\k{int(word_dur*100)}}}{word.upper()}\n")
                      current_time = end_time

          visuals = json.loads(os.environ["VISUALS_JSON"])
          if isinstance(visuals, dict): visuals = visuals.get("visuals") or [visuals]
          
          pipeline = KPipeline(lang_code="a")
          scene_files = []

          for i, item in enumerate(visuals):
              url = item.get("video_url") or item.get("image_url") or item.get("url")
              narration = item.get("narration") or item.get("text")
              
              v_p, is_video = download_visual(url, OUT / f"source_{i}")
              
              # Audio Generation
              chunks = [np.asarray(c, dtype=np.float32).reshape(-1) for _, _, c in pipeline(narration, voice="af_heart", speed=1.1)]
              sf.write(OUT / "temp.wav", np.concatenate(chunks), SAMPLE_RATE)
              wav_path = OUT / f"section_{i}.wav"
              subprocess.run(["ffmpeg", "-y", "-i", str(OUT / "temp.wav"), "-ar", str(OUTPUT_AUDIO_RATE), "-ac", "1", str(wav_path)], check=True)
              dur = get_duration(wav_path)

              # Create Subtitles
              ass_path = OUT / f"sub_{i}.ass"
              create_ass(narration.split(), dur, ass_path)

              # SCENE RENDERING (Normalization Stage)
              s_p = SCENES_DIR / f"scene_{i:02d}.mp4"
              v_in = ["-stream_loop", "-1", "-i", str(v_p)] if is_video else ["-loop", "1", "-i", str(v_p)]
              
              # Normalize every clip to exact same specs
              v_filt = (f"scale=1920:-1,crop=1080:1920:'(iw-ow)/2':'(ih-oh)/2-(ih-oh)/2*(t/{dur:.2f})',"
                        f"ass={ass_path},"
                        f"fps={FPS},format=yuv420p,"
                        f"tpad=stop_mode=clone:stop_duration={dur:.6f},trim=duration={dur:.6f},setpts=PTS-STARTPTS")
              
              a_filt = (f"aresample={OUTPUT_AUDIO_RATE},pan=mono|c0=c0,"
                        f"apad=pad_dur={dur:.6f},atrim=duration={dur:.6f},asetpts=PTS-STARTPTS")
              
              subprocess.run(["ffmpeg", "-y", *v_in, "-i", str(wav_path), "-filter_complex", f"[0:v]{v_filt}[v];[1:a]{a_filt}[a]", 
                           "-map", "[v]", "-map", "[a]", "-c:v", "libx264", "-preset", "ultrafast", "-crf", "24", 
                           "-c:a", "aac", "-b:a", "128k", "-t", f"{dur:.6f}", str(s_p)], check=True)
              scene_files.append(s_p)

          # STABLE CONCAT (Demuxer Stage - 0% Crash Risk)
          with open(OUT / "list.txt", "w") as f:
              for s in scene_files: f.write(f"file '{s.resolve()}'\n")
          
          subprocess.run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(OUT / "list.txt"), "-c", "copy", str(OUT / "raw.mp4")], check=True)
          
          # Final Mix with Background Music
          if os.path.exists("bg_music.mp3") and os.path.getsize("bg_music.mp3") > 0:
              subprocess.run(["ffmpeg", "-y", "-i", str(OUT / "raw.mp4"), "-stream_loop", "-1", "-i", "bg_music.mp3", 
                              "-filter_complex", "[1:a]volume=0.12[bg];[0:a][bg]amix=inputs=2:duration=first[a]", 
                              "-map", "0:v", "-map", "[a]", "-c:v", "copy", "-c:a", "aac", "final.mp4"], check=True)
          else:
              os.rename(OUT / "raw.mp4", "final.mp4")
          PY
          python3 render.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-artifact
          path: final.mp4
          retention-days: 1
