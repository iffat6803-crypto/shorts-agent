name: Render Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run ID"
        required: true
        type: string
      topic:
        description: "Video topic"
        required: true
        type: string
      script:
        description: "Complete narration script"
        required: true
        type: string
      title:
        description: "Video title"
        required: true
        type: string
      visuals:
        description: "JSON array of per-section visual assets"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pip
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir \
            "kokoro>=0.9.4" \
            soundfile \
            numpy \
            torch \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Verify Python packages
        run: |
          python3 - <<'PY'
          import sys
          import numpy
          import soundfile
          import torch
          import kokoro

          print("Python:", sys.version)
          print("numpy:", numpy.__version__)
          print("soundfile:", soundfile.__version__)
          print("torch:", torch.__version__)
          print("kokoro:", getattr(kokoro, "__version__", "installed"))
          PY

      - name: Show received inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
        run: |
          echo "Run ID: $RUN_ID"
          echo "Topic: $TOPIC"
          echo "Title: $TITLE"
          echo "Script words: $(printf '%s' "$SCRIPT" | wc -w)"

      - name: Render Short
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}

        run: |
          cat > render.py <<'PY'
          import json
          import math
          import os
          import pathlib
          import re
          import subprocess
          import urllib.request

          import numpy as np
          import soundfile as sf

          from kokoro import KPipeline


          # ============================================================
          # CONFIG
          # ============================================================

          OUT = pathlib.Path("out")
          OUT.mkdir(parents=True, exist_ok=True)

          SCRIPT = os.environ.get("SCRIPT", "").strip()
          VISUALS_RAW = os.environ.get("VISUALS_JSON", "").strip()

          SAMPLE_RATE = 24000
          FPS = 30

          WIDTH = 1080
          HEIGHT = 1920

          MIN_DURATION = 30.0
          MAX_DURATION = 60.0
          TARGET_MAX = 59.5

          # Small tolerance for encoded/container duration differences.
          DURATION_TOLERANCE = 0.12


          # ============================================================
          # BASIC VALIDATION
          # ============================================================

          if not SCRIPT:
              raise SystemExit("ERROR: SCRIPT is empty")


          # ============================================================
          # PARSE VISUAL INPUT
          # ============================================================

          try:
              visuals = json.loads(VISUALS_RAW)
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: VISUALS is not valid JSON: {exc}"
              )

          if isinstance(visuals, dict):
              visuals = (
                  visuals.get("visuals")
                  or visuals.get("sections")
                  or [visuals]
              )

          if not isinstance(visuals, list):
              raise SystemExit(
                  "ERROR: VISUALS must be a JSON array"
              )

          print("Visual assets supplied:", len(visuals))

          if len(visuals) < 2:
              raise SystemExit(
                  "ERROR: Fewer than 2 visual sections were supplied. "
                  "Render blocked to prevent one visual being reused "
                  "throughout the whole video."
              )


          def clean_text(value):
              if value is None:
                  return ""
              return str(value).strip()


          def get_url(item):
              if not isinstance(item, dict):
                  return None

              # Prefer actual video URLs before image URLs.
              for key in (
                  "video_url",
                  "url",
                  "video",
                  "video_link",
                  "link",
                  "image_url",
                  "image",
                  "image_link",
                  "thumbnail",
              ):
                  value = item.get(key)

                  if isinstance(value, str):
                      value = value.strip()

                      if (
                          value.startswith("https://")
                          or
                          value.startswith("http://")
                      ):
                          return value

              return None


          section_inputs = []

          for index, item in enumerate(visuals):

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"ERROR: Visual section {index + 1} "
                      "is not an object"
                  )

              url = get_url(item)

              narration = clean_text(
                  item.get("narration")
                  or item.get("text")
                  or item.get("script")
              )

              query = clean_text(
                  item.get("query")
                  or item.get("search_query")
              )

              if not url:
                  raise SystemExit(
                      f"ERROR: Visual section {index + 1} "
                      "has no usable URL"
                  )

              if not narration:
                  raise SystemExit(
                      f"ERROR: Visual section {index + 1} "
                      "has no narration"
                  )

              section_inputs.append({
                  "index": index,
                  "url": url,
                  "narration": narration,
                  "query": query,
              })


          print(
              "Validated visual sections:",
              len(section_inputs)
          )


          # ============================================================
          # DOWNLOAD ONE VISUAL FOR EVERY SECTION
          # ============================================================

          downloaded = []

          for section in section_inputs:

              index = section["index"]
              url = section["url"]

              success = False

              for attempt in range(1, 4):

                  try:

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          data = response.read()

                          content_type = (
                              response.headers.get(
                                  "Content-Type",
                                  ""
                              ).lower()
                          )

                      if not data:
                          raise RuntimeError(
                              "Empty response"
                          )

                      clean_url = (
                          url.lower()
                          .split("?")[0]
                      )

                      is_image = (
                          "image/" in content_type
                          or
                          clean_url.endswith(
                              (
                                  ".jpg",
                                  ".jpeg",
                                  ".png",
                                  ".webp"
                              )
                          )
                      )

                      extension = (
                          ".jpg"
                          if is_image
                          else ".mp4"
                      )

                      path = (
                          OUT /
                          f"source_{index}{extension}"
                      )

                      path.write_bytes(data)

                      downloaded.append({
                          "index": index,
                          "path": path,
                          "kind": (
                              "image"
                              if is_image
                              else "video"
                          ),
                          "narration": section["narration"],
                          "query": section["query"],
                      })

                      print(
                          f"Section {index + 1}: "
                          f"downloaded {extension} "
                          f"({path.stat().st_size} bytes)"
                      )

                      success = True
                      break

                  except Exception as exc:

                      print(
                          f"Section {index + 1}: "
                          f"attempt {attempt} failed: {exc}"
                      )

              if not success:
                  raise SystemExit(
                      f"ERROR: Could not download visual "
                      f"for section {index + 1}"
                  )


          if len(downloaded) != len(section_inputs):
              raise SystemExit(
                  "ERROR: Visual count does not match "
                  "section count."
              )


          # ============================================================
          # KOKORO — GENERATE AUDIO PER SCENE
          # ============================================================

          print(
              "Generating section-by-section narration "
              "with Kokoro..."
          )

          pipeline = KPipeline(
              lang_code="a"
          )

          section_audio = []


          for item in downloaded:

              index = item["index"]

              print(
                  f"Generating audio for section "
                  f"{index + 1}..."
              )

              chunks = []

              for _, _, audio_chunk in pipeline(
                  item["narration"],
                  voice="af_heart",
                  speed=1.0
              ):

                  audio_chunk = np.asarray(
                      audio_chunk,
                      dtype=np.float32
                  ).reshape(-1)

                  if audio_chunk.size:
                      chunks.append(audio_chunk)

              if not chunks:
                  raise SystemExit(
                      f"ERROR: Kokoro produced no audio "
                      f"for section {index + 1}"
                  )

              audio = np.concatenate(chunks)

              duration = (
                  len(audio) / SAMPLE_RATE
              )

              wav_path = (
                  OUT /
                  f"section_{index:02d}.wav"
              )

              sf.write(
                  wav_path,
                  audio,
                  SAMPLE_RATE
              )

              section_audio.append({
                  "index": index,
                  "path": wav_path,
                  "duration": duration,
                  "narration": item["narration"],
                  "visual": item,
              })

              print(
                  f"Section {index + 1} audio duration: "
                  f"{duration:.3f}s"
              )


          original_total = sum(
              item["duration"]
              for item in section_audio
          )

          print(
              f"Original total narration: "
              f"{original_total:.3f}s"
          )


          # ============================================================
          # NORMALIZE IF OVER 60 SECONDS
          #
          # Every scene is sped up by the SAME factor.
          # This preserves scene-to-scene alignment.
          # ============================================================

          if original_total > TARGET_MAX:

              factor = (
                  original_total /
                  TARGET_MAX
              )

              factor = max(
                  1.01,
                  min(factor, 2.0)
              )

              print(
                  "Total narration exceeds target."
              )

              print(
                  f"Uniform audio speed factor: "
                  f"{factor:.6f}"
              )

              for item in section_audio:

                  source = item["path"]

                  normalized = (
                      OUT /
                      f"section_"
                      f"{item['index']:02d}_normalized.wav"
                  )

                  subprocess.run(
                      [
                          "ffmpeg",
                          "-y",
                          "-i",
                          str(source),
                          "-af",
                          f"atempo={factor:.6f}",
                          "-ar",
                          str(SAMPLE_RATE),
                          "-ac",
                          "1",
                          "-c:a",
                          "pcm_s16le",
                          str(normalized)
                      ],
                      check=True
                  )

                  new_duration = float(
                      subprocess.check_output(
                          [
                              "ffprobe",
                              "-v",
                              "error",
                              "-show_entries",
                              "format=duration",
                              "-of",
                              "default="
                              "noprint_wrappers=1:"
                              "nokey=1",
                              str(normalized)
                          ],
                          text=True
                      ).strip()
                  )

                  item["path"] = normalized
                  item["duration"] = new_duration


          # ============================================================
          # ENSURE MINIMUM 30 SECONDS
          #
          # Silence is added ONLY to the final scene.
          # Earlier scenes never move.
          # ============================================================

          total_after_speed = sum(
              item["duration"]
              for item in section_audio
          )

          if total_after_speed < MIN_DURATION:

              padding = (
                  MIN_DURATION -
                  total_after_speed
              )

              last = section_audio[-1]

              padded = (
                  OUT /
                  f"section_"
                  f"{last['index']:02d}_padded.wav"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(last["path"]),
                      "-af",
                      f"apad=pad_dur={padding:.3f}",
                      "-t",
                      f"{last['duration'] + padding:.3f}",
                      "-ar",
                      str(SAMPLE_RATE),
                      "-ac",
                      "1",
                      "-c:a",
                      "pcm_s16le",
                      str(padded)
                  ],
                  check=True
              )

              last["path"] = padded
              last["duration"] += padding

              print(
                  f"Added {padding:.3f}s silence "
                  "to final scene."
              )


          final_audio_duration = sum(
              item["duration"]
              for item in section_audio
          )

          if final_audio_duration > MAX_DURATION + 0.01:
              raise SystemExit(
                  f"ERROR: Audio duration exceeds 60s: "
                  f"{final_audio_duration:.3f}s"
              )

          print(
              f"Final narration duration: "
              f"{final_audio_duration:.3f}s"
          )


          # ============================================================
          # VISUAL FILTER
          #
          # Foreground preserves original aspect ratio.
          # No aggressive crop on the actual subject.
          #
          # Background fills 1080x1920 and is blurred.
          # ============================================================

          def make_visual_filter():

              return (
                  "[0:v]"
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "boxblur=18:2,"
                  "setsar=1"
                  "[bg];"

                  "[0:v]"
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=decrease,"
                  "setsar=1"
                  "[fg];"

                  "[bg][fg]"
                  "overlay="
                  "(W-w)/2:"
                  "(H-h)/2,"
                  "setsar=1,"
                  "fps=30"
              )


          # ============================================================
          # CREATE EACH SCENE AS A COMPLETE A/V UNIT
          #
          # THIS IS THE IMPORTANT FIX.
          #
          # Each scene gets:
          #   VIDEO = exact scene duration
          #   AUDIO = exact same scene duration
          #
          # We do NOT concatenate audio and video separately anymore.
          # ============================================================

          scene_files = []


          for item in section_audio:

              index = item["index"]
              duration = item["duration"]
              source = item["visual"]["path"]
              kind = item["visual"]["kind"]
              audio_source = item["path"]

              scene_file = (
                  OUT /
                  f"scene_{index:02d}.mp4"
              )

              duration_text = (
                  f"{duration:.6f}"
              )

              print(
                  ""
              )

              print(
                  "================================================"
              )

              print(
                  f"RENDERING SCENE {index + 1}"
              )

              print(
                  f"Scene duration: {duration_text}s"
              )

              print(
                  f"Visual type: {kind}"
              )

              print(
                  "================================================"
              )


              # --------------------------------------------------------
              # IMAGE SCENE
              # --------------------------------------------------------

              if kind == "image":

                  command = [
                      "ffmpeg",
                      "-y",

                      "-loop",
                      "1",
                      "-framerate",
                      str(FPS),
                      "-i",
                      str(source),

                      "-i",
                      str(audio_source),

                      "-filter_complex",
                      make_visual_filter(),

                      "-map",
                      "[outv]" if False else "0:v:0",
                      "-map",
                      "1:a:0",

                      "-t",
                      duration_text,

                      "-r",
                      str(FPS),

                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "23",

                      "-pix_fmt",
                      "yuv420p",

                      "-c:a",
                      "aac",
                      "-b:a",
                      "128k",

                      "-ar",
                      "48000",

                      "-ac",
                      "1",

                      "-shortest",

                      "-movflags",
                      "+faststart",

                      str(scene_file)
                  ]

              # --------------------------------------------------------
              # VIDEO SCENE
              # --------------------------------------------------------

              else:

                  command = [
                      "ffmpeg",
                      "-y",

                      "-stream_loop",
                      "-1",
                      "-i",
                      str(source),

                      "-i",
                      str(audio_source),

                      "-filter_complex",
                      make_visual_filter(),

                      "-map",
                      "0:v:0",
                      "-map",
                      "1:a:0",

                      "-t",
                      duration_text,

                      "-r",
                      str(FPS),

                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "23",

                      "-pix_fmt",
                      "yuv420p",

                      "-c:a",
                      "aac",
                      "-b:a",
                      "128k",

                      "-ar",
                      "48000",

                      "-ac",
                      "1",

                      "-shortest",

                      "-movflags",
                      "+faststart",

                      str(scene_file)
                  ]


              # --------------------------------------------------------
              # IMPORTANT:
              # The previous version accidentally built a filter graph
              # but then mapped the raw video stream.
              #
              # Here we deliberately use a simpler, reliable scene
              # pipeline below.
              # --------------------------------------------------------

              if kind == "image":

                  command = [
                      "ffmpeg",
                      "-y",

                      "-loop",
                      "1",
                      "-framerate",
                      str(FPS),
                      "-i",
                      str(source),

                      "-i",
                      str(audio_source),

                      "-filter_complex",
                      (
                          "[0:v]"
                          "scale=1080:1920:"
                          "force_original_aspect_ratio=increase,"
                          "crop=1080:1920,"
                          "boxblur=18:2,"
                          "setsar=1"
                          "[bg];"

                          "[0:v]"
                          "scale=1080:1920:"
                          "force_original_aspect_ratio=decrease,"
                          "setsar=1"
                          "[fg];"

                          "[bg][fg]"
                          "overlay="
                          "(W-w)/2:"
                          "(H-h)/2,"
                          "setsar=1,"
                          "fps=30"
                          "[v]"
                      ),

                      "-map",
                      "[v]",
                      "-map",
                      "1:a:0",

                      "-t",
                      duration_text,

                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "23",

                      "-pix_fmt",
                      "yuv420p",

                      "-c:a",
                      "aac",
                      "-b:a",
                      "128k",

                      "-ar",
                      "48000",
                      "-ac",
                      "1",

                      "-shortest",

                      "-movflags",
                      "+faststart",

                      str(scene_file)
                  ]

              else:

                  command = [
                      "ffmpeg",
                      "-y",

                      "-stream_loop",
                      "-1",
                      "-i",
                      str(source),

                      "-i",
                      str(audio_source),

                      "-filter_complex",
                      (
                          "[0:v]"
                          "scale=1080:1920:"
                          "force_original_aspect_ratio=increase,"
                          "crop=1080:1920,"
                          "boxblur=18:2,"
                          "setsar=1"
                          "[bg];"

                          "[0:v]"
                          "scale=1080:1920:"
                          "force_original_aspect_ratio=decrease,"
                          "setsar=1"
                          "[fg];"

                          "[bg][fg]"
                          "overlay="
                          "(W-w)/2:"
                          "(H-h)/2,"
                          "setsar=1,"
                          "fps=30"
                          "[v]"
                      ),

                      "-map",
                      "[v]",
                      "-map",
                      "1:a:0",

                      "-t",
                      duration_text,

                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "23",

                      "-pix_fmt",
                      "yuv420p",

                      "-c:a",
                      "aac",
                      "-b:a",
                      "128k",

                      "-ar",
                      "48000",
                      "-ac",
                      "1",

                      "-shortest",

                      "-movflags",
                      "+faststart",

                      str(scene_file)
                  ]


              subprocess.run(
                  command,
                  check=True
              )


              # --------------------------------------------------------
              # VERIFY ACTUAL SCENE DURATION
              # --------------------------------------------------------

              probe = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(scene_file)
                  ],
                  text=True
              ).strip()

              actual_duration = float(probe)

              print(
                  f"Scene {index + 1} actual duration: "
                  f"{actual_duration:.3f}s"
              )

              if abs(
                  actual_duration -
                  duration
              ) > DURATION_TOLERANCE:

                  raise SystemExit(
                      f"ERROR: Scene {index + 1} duration mismatch. "
                      f"Expected {duration:.3f}s, "
                      f"got {actual_duration:.3f}s."
                  )


              scene_files.append(
                  scene_file
              )


          # ============================================================
          # FINAL CONCAT
          #
          # IMPORTANT:
          # Every scene already contains matching A/V.
          #
          # We use FFmpeg concat FILTER rather than relying on a
          # separate audio concat and video concat.
          #
          # This avoids the cumulative timestamp drift that caused
          # later scenes to play after their narration.
          # ============================================================

          print("")
          print(
              "================================================"
          )

          print(
              "FINAL AUDIO/VIDEO CONCAT"
          )

          print(
              "================================================"
          )


          input_args = []

          for scene_file in scene_files:

              input_args.extend(
                  [
                      "-i",
                      str(scene_file)
                  ]
              )


          concat_inputs = ""

          for i in range(len(scene_files)):

              concat_inputs += (
                  f"[{i}:v:0]"
                  f"[{i}:a:0]"
              )


          concat_filter = (
              concat_inputs
              +
              f"concat="
              f"n={len(scene_files)}:"
              f"v=1:"
              f"a=1"
              f"[vout]"
              f"[aout]"
          )


          final = pathlib.Path(
              "final-short.mp4"
          )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",

                  *input_args,

                  "-filter_complex",
                  concat_filter,

                  "-map",
                  "[vout]",
                  "-map",
                  "[aout]",

                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",

                  "-pix_fmt",
                  "yuv420p",

                  "-r",
                  str(FPS),

                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",

                  "-ar",
                  "48000",
                  "-ac",
                  "1",

                  "-movflags",
                  "+faststart",

                  str(final)
              ],
              check=True
          )


          # ============================================================
          # CREATE SUBTITLES FROM THE EXACT SAME SCENE TIMELINE
          # ============================================================

          def timestamp(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours, remainder = divmod(
                  total_ms,
                  3600000
              )

              minutes, remainder = divmod(
                  remainder,
                  60000
              )

              seconds_int, milliseconds = divmod(
                  remainder,
                  1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{seconds_int:02d},"
                  f"{milliseconds:03d}"
              )


          def caption_chunks(text):

              words = text.split()

              if not words:
                  return []

              chunks = []
              current = []

              for word in words:

                  candidate = " ".join(
                      current + [word]
                  )

                  if current and (
                      len(current) >= 5
                      or len(candidate) > 34
                  ):

                      chunks.append(
                          " ".join(current)
                      )

                      current = [word]

                  else:

                      current.append(word)

              if current:
                  chunks.append(
                      " ".join(current)
                  )

              return chunks


          srt_path = (
              OUT /
              "captions.srt"
          )

          current_time = 0.0
          caption_number = 1


          with srt_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              for section in section_audio:

                  section_start = current_time

                  section_end = (
                      section_start +
                      section["duration"]
                  )

                  parts = caption_chunks(
                      section["narration"]
                  )

                  if not parts:
                      parts = [
                          section["narration"]
                      ]

                  weights = []

                  for part in parts:

                      count = len(
                          re.findall(
                              r"\b[\w'-]+\b",
                              part
                          )
                      )

                      weights.append(
                          max(1, count)
                      )

                  total_weight = sum(
                      weights
                  )

                  local_time = section_start

                  for part, weight in zip(
                      parts,
                      weights
                  ):

                      part_duration = (
                          section["duration"]
                          * weight
                          / total_weight
                      )

                      start = local_time

                      end = min(
                          section_end,
                          local_time +
                          part_duration
                      )

                      f.write(
                          f"{caption_number}\n"
                          f"{timestamp(start)} --> "
                          f"{timestamp(end)}\n"
                          f"{part}\n\n"
                      )

                      caption_number += 1
                      local_time = end

                  current_time = section_end


          # ============================================================
          # BURN SUBTITLES
          #
          # The underlying A/V is already synchronized.
          # Subtitle timestamps use the exact same scene durations.
          # ============================================================

          subtitled = pathlib.Path(
              "final-short-subtitled.mp4"
          )

          subtitle_filter = (
              f"subtitles={srt_path}:"
              "force_style="
              "'FontName=DejaVu Sans,"
              "FontSize=20,"
              "Bold=1,"
              "PrimaryColour=&H00FFFFFF,"
              "OutlineColour=&H00000000,"
              "BorderStyle=1,"
              "Outline=3,"
              "Shadow=0,"
              "Alignment=2,"
              "MarginV=220'"
          )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",

                  "-i",
                  str(final),

                  "-vf",
                  subtitle_filter,

                  "-map",
                  "0:v:0",
                  "-map",
                  "0:a:0",

                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",

                  "-pix_fmt",
                  "yuv420p",

                  "-r",
                  str(FPS),

                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",

                  "-ar",
                  "48000",
                  "-ac",
                  "1",

                  "-movflags",
                  "+faststart",

                  str(subtitled)
              ],
              check=True
          )


          # Replace final output with subtitled version.
          subtitled.replace(final)


          # ============================================================
          # FINAL VALIDATION
          # ============================================================

          final_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(final)
                  ],
                  text=True
              ).strip()
          )


          video_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-select_streams",
                      "v:0",
                      "-show_entries",
                      "stream=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(final)
                  ],
                  text=True
              ).strip()
          )


          audio_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-select_streams",
                      "a:0",
                      "-show_entries",
                      "stream=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(final)
                  ],
                  text=True
              ).strip()
          )


          size = final.stat().st_size


          print("")
          print(
              "================================================"
          )

          print(
              "FINAL VALIDATION"
          )

          print(
              "================================================"
          )

          print(
              f"Container duration: "
              f"{final_duration:.3f}s"
          )

          print(
              f"Video stream duration: "
              f"{video_duration:.3f}s"
          )

          print(
              f"Audio stream duration: "
              f"{audio_duration:.3f}s"
          )

          print(
              f"Rendered sections: "
              f"{len(section_audio)}"
          )

          print(
              f"File size: "
              f"{size} bytes"
          )


          if size <= 0:
              raise SystemExit(
                  "ERROR: final-short.mp4 is empty"
              )


          if final_duration < 29.5:
              raise SystemExit(
                  f"ERROR: Final video too short: "
                  f"{final_duration:.3f}s"
              )


          if final_duration > 60.5:
              raise SystemExit(
                  f"ERROR: Final video too long: "
                  f"{final_duration:.3f}s"
              )


          # Final A/V duration must be extremely close.
          if abs(
              video_duration -
              audio_duration
          ) > 0.20:

              raise SystemExit(
                  "ERROR: FINAL A/V DURATION MISMATCH: "
                  f"video={video_duration:.3f}s, "
                  f"audio={audio_duration:.3f}s"
              )


          # Expected duration comes from the actual scene audio.
          if abs(
              final_duration -
              final_audio_duration
          ) > 0.25:

              raise SystemExit(
                  "ERROR: Final duration does not match "
                  "the section-audio timeline: "
                  f"expected={final_audio_duration:.3f}s, "
                  f"actual={final_duration:.3f}s"
              )


          print("")
          print(
              "A/V SYNCHRONIZATION VALIDATION: PASSED"
          )

          print(
              "VIDEO READY:",
              final.resolve()
          )

          PY

          python3 render.py

      - name: Upload MP4 to Google Drive and append Sheet row
        if: success()
        continue-on-error: true

        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}

        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import sys

          required = [
              "GDRIVE_SERVICE_ACCOUNT_JSON",
              "GDRIVE_FOLDER_ID",
              "GOOGLE_SHEET_ID"
          ]

          missing = [
              name
              for name in required
              if not os.environ.get(name)
          ]

          if missing:

              print(
                  "WARNING: Missing Google secrets:",
                  ", ".join(missing)
              )

              print(
                  "Skipping Drive/Sheets upload."
              )

              sys.exit(0)


          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  json.loads(
                      os.environ[
                          "GDRIVE_SERVICE_ACCOUNT_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/drive",
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )


          sheets = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False
          )


          run_id = os.environ["RUN_ID"]
          topic = os.environ["TOPIC"]
          title = os.environ["TITLE"]


          metadata = {
              "name": f"{run_id}.mp4",
              "parents": [
                  os.environ["GDRIVE_FOLDER_ID"]
              ],
              "mimeType": "video/mp4"
          }


          media = MediaFileUpload(
              "final-short.mp4",
              mimetype="video/mp4",
              resumable=True,
              chunksize=8 * 1024 * 1024
          )


          uploaded = (
              drive.files()
              .create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,webViewLink"
              )
              .execute()
          )


          file_id = uploaded["id"]


          link = (
              uploaded.get("webViewLink")
              or
              f"https://drive.google.com/file/d/"
              f"{file_id}/view"
          )


          try:

              drive.permissions().create(
                  fileId=file_id,
                  body={
                      "type": "anyone",
                      "role": "reader"
                  },
                  fields="id"
              ).execute()

              link = (
                  f"https://drive.google.com/file/d/"
                  f"{file_id}/view"
              )

          except Exception as exc:

              print(
                  "WARNING: Could not enable public "
                  "Drive sharing:",
                  exc
              )


          sheet_range = (
              os.environ.get(
                  "GOOGLE_SHEET_RANGE"
              )
              or
              "Sheet1!A:F"
          )


          row = [[
              datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),

              run_id,

              title,

              topic,

              "DONE",

              link
          ]]


          (
              sheets.spreadsheets()
              .values()
              .append(
                  spreadsheetId=os.environ[
                      "GOOGLE_SHEET_ID"
                  ],
                  range=sheet_range,
                  valueInputOption="USER_ENTERED",
                  insertDataOption="INSERT_ROWS",
                  body={
                      "values": row
                  }
              )
              .execute()
          )


          print(
              "VIDEO_URL:",
              link
          )

          PY

      - name: Upload GitHub artifact backup
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: final-short-${{ github.run_id }}

          path: |
            final-short.mp4
            out/voice.wav
            out/captions.srt
            out/section_*.wav
            out/scene_*.mp4

          if-no-files-found: warn

          retention-days: 7
