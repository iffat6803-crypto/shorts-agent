name: Render Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run ID"
        required: true
        type: string

      topic:
        description: "Video topic"
        required: true
        type: string

      script:
        description: "Complete narration script"
        required: true
        type: string

      title:
        description: "Video title"
        required: true
        type: string

      visuals:
        description: "JSON array of per-section visual assets"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pip

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip

          python3 -m pip install --no-cache-dir \
            "kokoro>=0.9.4" \
            soundfile \
            numpy \
            torch \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Verify Python packages
        run: |
          python3 - <<'PY'
          import sys
          import numpy
          import soundfile
          import torch
          import kokoro

          print("Python:", sys.version)
          print("numpy:", numpy.__version__)
          print("soundfile:", soundfile.__version__)
          print("torch:", torch.__version__)
          print("kokoro:", getattr(kokoro, "__version__", "installed"))
          PY

      - name: Show received inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
        run: |
          echo "Run ID: $RUN_ID"
          echo "Topic: $TOPIC"
          echo "Title: $TITLE"
          echo "Script words: $(printf '%s' "$SCRIPT" | wc -w)"

      - name: Render Short
        env:
          RUN_ID: ${{ inputs.run_id }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}

        run: |

          cat > render.py <<'PY'

          import json
          import math
          import os
          import pathlib
          import re
          import subprocess
          import urllib.request

          import numpy as np
          import soundfile as sf

          from kokoro import KPipeline


          # ============================================================
          # CONFIG
          # ============================================================

          OUT = pathlib.Path("out")
          OUT.mkdir(parents=True, exist_ok=True)

          SCRIPT = os.environ.get("SCRIPT", "").strip()
          VISUALS_RAW = os.environ.get("VISUALS_JSON", "").strip()

          SAMPLE_RATE = 24000
          OUTPUT_AUDIO_RATE = 48000

          FPS = 30

          WIDTH = 1080
          HEIGHT = 1920

          MIN_DURATION = 30.0
          MAX_DURATION = 60.0
          TARGET_MAX = 59.5

          FINAL_TOLERANCE = 0.25


          # ============================================================
          # BASIC VALIDATION
          # ============================================================

          if not SCRIPT:
              raise SystemExit("ERROR: SCRIPT is empty")


          if not VISUALS_RAW:
              raise SystemExit("ERROR: VISUALS_JSON is empty")


          # ============================================================
          # PARSE VISUALS
          # ============================================================

          try:
              visuals = json.loads(VISUALS_RAW)

          except Exception as exc:
              raise SystemExit(
                  f"ERROR: VISUALS is not valid JSON: {exc}"
              )


          if isinstance(visuals, dict):
              visuals = (
                  visuals.get("visuals")
                  or visuals.get("sections")
                  or [visuals]
              )


          if not isinstance(visuals, list):
              raise SystemExit(
                  "ERROR: VISUALS must be a JSON array"
              )


          print("Visual assets supplied:", len(visuals))


          if len(visuals) < 2:
              raise SystemExit(
                  "ERROR: Fewer than 2 visual sections were supplied. "
                  "Rendering stopped."
              )


          def clean_text(value):
              if value is None:
                  return ""
              return str(value).strip()


          def get_url(item):

              if not isinstance(item, dict):
                  return None

              for key in (
                  "video_url",
                  "url",
                  "video",
                  "video_link",
                  "link",
                  "image_url",
                  "image",
                  "image_link",
                  "thumbnail",
              ):

                  value = item.get(key)

                  if isinstance(value, str):

                      value = value.strip()

                      if (
                          value.startswith("https://")
                          or
                          value.startswith("http://")
                      ):
                          return value

              return None


          # ============================================================
          # VALIDATE EACH SECTION
          #
          # IMPORTANT:
          # Each visual object remains permanently paired with its own
          # narration. No later stage is allowed to reorder them.
          # ============================================================

          section_inputs = []


          for index, item in enumerate(visuals):

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"ERROR: Visual section {index + 1} "
                      "is not an object."
                  )


              url = get_url(item)


              narration = clean_text(
                  item.get("narration")
                  or item.get("text")
                  or item.get("script")
              )


              query = clean_text(
                  item.get("query")
                  or item.get("search_query")
              )


              if not url:
                  raise SystemExit(
                      f"ERROR: Visual section {index + 1} "
                      "has no usable URL."
                  )


              if not narration:
                  raise SystemExit(
                      f"ERROR: Visual section {index + 1} "
                      "has no narration."
                  )


              section_inputs.append({
                  "index": index,
                  "url": url,
                  "narration": narration,
                  "query": query,
              })


          print(
              "Validated sections:",
              len(section_inputs)
          )


          # ============================================================
          # DOWNLOAD EXACTLY ONE VISUAL PER SECTION
          #
          # Scene index is preserved.
          # ============================================================

          downloaded = []


          for section in section_inputs:

              index = section["index"]
              url = section["url"]

              success = False


              for attempt in range(1, 4):

                  try:

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0"
                          }
                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          data = response.read()

                          content_type = (
                              response.headers.get(
                                  "Content-Type",
                                  ""
                              ).lower()
                          )


                      if not data:
                          raise RuntimeError(
                              "Empty response"
                          )


                      clean_url = (
                          url.lower()
                          .split("?")[0]
                      )


                      is_image = (
                          "image/" in content_type
                          or
                          clean_url.endswith(
                              (
                                  ".jpg",
                                  ".jpeg",
                                  ".png",
                                  ".webp"
                              )
                          )
                      )


                      extension = (
                          ".jpg"
                          if is_image
                          else ".mp4"
                      )


                      path = (
                          OUT /
                          f"source_{index}{extension}"
                      )


                      path.write_bytes(data)


                      downloaded.append({
                          "index": index,
                          "path": path,
                          "kind": (
                              "image"
                              if is_image
                              else "video"
                          ),
                          "narration": section["narration"],
                          "query": section["query"],
                          "url": url,
                      })


                      print(
                          f"Section {index + 1}: "
                          f"downloaded {extension} "
                          f"({path.stat().st_size} bytes)"
                      )


                      success = True
                      break


                  except Exception as exc:

                      print(
                          f"Section {index + 1}: "
                          f"attempt {attempt} failed: {exc}"
                      )


              if not success:

                  raise SystemExit(
                      f"ERROR: Could not download visual "
                      f"for section {index + 1}"
                  )


          if len(downloaded) != len(section_inputs):

              raise SystemExit(
                  "ERROR: Every narration section must "
                  "have exactly one visual."
              )


          # ============================================================
          # KOKORO AUDIO — ONE WAV PER SECTION
          #
          # IMPORTANT:
          # Audio is generated from the exact narration belonging to
          # the exact visual section.
          # ============================================================

          print(
              "Generating section-by-section narration..."
          )


          pipeline = KPipeline(
              lang_code="a"
          )


          section_audio = []


          for item in downloaded:

              index = item["index"]


              print(
                  f"Generating audio for section "
                  f"{index + 1}..."
              )


              chunks = []


              for _, _, audio_chunk in pipeline(
                  item["narration"],
                  voice="af_heart",
                  speed=1.0
              ):

                  audio_chunk = np.asarray(
                      audio_chunk,
                      dtype=np.float32
                  ).reshape(-1)


                  if audio_chunk.size:
                      chunks.append(audio_chunk)


              if not chunks:
                  raise SystemExit(
                      f"ERROR: Kokoro produced no audio "
                      f"for section {index + 1}"
                  )


              audio = np.concatenate(chunks)


              duration = (
                  len(audio) /
                  SAMPLE_RATE
              )


              wav_path = (
                  OUT /
                  f"section_{index:02d}.wav"
              )


              sf.write(
                  wav_path,
                  audio,
                  SAMPLE_RATE
              )


              section_audio.append({
                  "index": index,
                  "path": wav_path,
                  "duration": duration,
                  "narration": item["narration"],
                  "visual": item,
              })


              print(
                  f"Section {index + 1} audio: "
                  f"{duration:.6f}s"
              )


          original_total = sum(
              item["duration"]
              for item in section_audio
          )


          print(
              f"Original audio total: "
              f"{original_total:.6f}s"
          )


          # ============================================================
          # IF TOTAL AUDIO > 59.5s
          #
          # SAME SPEED FACTOR FOR EVERY SECTION.
          #
          # This is important because changing each section separately
          # could alter the visual/audio relationship.
          # ============================================================

          if original_total > TARGET_MAX:

              factor = (
                  original_total /
                  TARGET_MAX
              )


              if factor > 2.0:

                  raise SystemExit(
                      "ERROR: Narration is too long. "
                      f"Required speed factor is {factor:.3f}x. "
                      "Maximum supported automatic factor is 2.0x. "
                      "Shorten the script before rendering."
                  )


              factor = max(
                  1.01,
                  factor
              )


              print(
                  f"Applying uniform audio speed: "
                  f"{factor:.6f}x"
              )


              for item in section_audio:

                  source = item["path"]


                  normalized = (
                      OUT /
                      f"section_"
                      f"{item['index']:02d}_normalized.wav"
                  )


                  subprocess.run(
                      [
                          "ffmpeg",
                          "-y",
                          "-i",
                          str(source),
                          "-af",
                          f"atempo={factor:.6f}",
                          "-ar",
                          str(SAMPLE_RATE),
                          "-ac",
                          "1",
                          "-c:a",
                          "pcm_s16le",
                          str(normalized)
                      ],
                      check=True
                  )


                  new_duration = float(
                      subprocess.check_output(
                          [
                              "ffprobe",
                              "-v",
                              "error",
                              "-show_entries",
                              "format=duration",
                              "-of",
                              "default="
                              "noprint_wrappers=1:"
                              "nokey=1",
                              str(normalized)
                          ],
                          text=True
                      ).strip()
                  )


                  item["path"] = normalized
                  item["duration"] = new_duration


          # ============================================================
          # MINIMUM 30s
          #
          # Padding only goes to the LAST section.
          # ============================================================

          total_after_speed = sum(
              item["duration"]
              for item in section_audio
          )


          if total_after_speed < MIN_DURATION:

              padding = (
                  MIN_DURATION -
                  total_after_speed
              )


              last = section_audio[-1]


              padded = (
                  OUT /
                  f"section_"
                  f"{last['index']:02d}_padded.wav"
              )


              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(last["path"]),
                      "-af",
                      f"apad=pad_dur={padding:.6f}",
                      "-t",
                      f"{last['duration'] + padding:.6f}",
                      "-ar",
                      str(SAMPLE_RATE),
                      "-ac",
                      "1",
                      "-c:a",
                      "pcm_s16le",
                      str(padded)
                  ],
                  check=True
              )


              last["path"] = padded

              last["duration"] = (
                  last["duration"] +
                  padding
              )


              print(
                  f"Added {padding:.6f}s silence "
                  "to final section."
              )


          final_audio_duration = sum(
              item["duration"]
              for item in section_audio
          )


          print(
              f"Final audio timeline: "
              f"{final_audio_duration:.6f}s"
          )


          if final_audio_duration > MAX_DURATION + 0.05:

              raise SystemExit(
                  f"ERROR: Audio exceeds 60 seconds: "
                  f"{final_audio_duration:.6f}s"
              )


          # ============================================================
          # CREATE MASTER AUDIO
          # ============================================================

          audio_concat = (
              OUT /
              "audio_concat.txt"
          )


          with audio_concat.open(
              "w",
              encoding="utf-8"
          ) as f:

              for item in section_audio:

                  f.write(
                      f"file '{item['path'].resolve()}'\n"
                  )


          master_audio = (
              OUT /
              "master_audio.wav"
          )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(audio_concat),
                  "-ar",
                  str(SAMPLE_RATE),
                  "-ac",
                  "1",
                  "-c:a",
                  "pcm_s16le",
                  str(master_audio)
              ],
              check=True
          )


          master_audio_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(master_audio)
                  ],
                  text=True
              ).strip()
          )


          print(
              f"Master audio actual duration: "
              f"{master_audio_duration:.6f}s"
          )


          # ============================================================
          # BUILD ONE FFmpeg FILTER GRAPH
          #
          # CRITICAL FIX:
          #
          # ALL visual inputs are added FIRST.
          #
          # Then ALL audio inputs are added AFTER them.
          #
          # Therefore:
          #
          # visual 0 = input 0
          # visual 1 = input 1
          # visual 2 = input 2
          #
          # audio 0 = input N
          # audio 1 = input N+1
          # audio 2 = input N+2
          #
          # This matches audio_input_index below.
          # ============================================================

          input_args = []

          filter_parts = []

          video_labels = []
          audio_labels = []


          # ============================================================
          # FIRST: ADD ALL VISUAL INPUTS
          # ============================================================

          for i, item in enumerate(section_audio):

              visual = item["visual"]

              source = visual["path"]
              kind = visual["kind"]


              if kind == "image":

                  input_args.extend(
                      [
                          "-loop",
                          "1",
                          "-framerate",
                          str(FPS),
                          "-i",
                          str(source)
                      ]
                  )

              else:

                  input_args.extend(
                      [
                          "-stream_loop",
                          "-1",
                          "-i",
                          str(source)
                      ]
                  )


          # ============================================================
          # SECOND: ADD ALL AUDIO INPUTS
          # ============================================================

          scene_count = len(section_audio)


          for i, item in enumerate(section_audio):

              input_args.extend(
                  [
                      "-i",
                      str(item["path"])
                  ]
              )


          # ============================================================
          # NOW BUILD EACH A/V SCENE
          # ============================================================

          for i, item in enumerate(section_audio):

              visual = item["visual"]
              duration = item["duration"]

              source = visual["path"]
              kind = visual["kind"]


              # --------------------------------------------------------
              # VIDEO INPUT INDEX
              # --------------------------------------------------------

              video_input_index = i


              # --------------------------------------------------------
              # AUDIO INPUT INDEX
              #
              # Because ALL visual inputs were added first:
              #
              # audio input = scene_count + i
              # --------------------------------------------------------

              audio_input_index = (
                  scene_count +
                  i
              )


              # --------------------------------------------------------
              # VISUAL
              #
              # The foreground keeps its aspect ratio.
              # Background fills the 9:16 canvas.
              # --------------------------------------------------------

              visual_filter = (
                  f"[{video_input_index}:v:0]"
                  f"trim=duration={duration:.6f},"
                  "setpts=PTS-STARTPTS,"
                  "split=2[base][fgsrc];"

                  "[base]"
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "boxblur=20:2,"
                  "setsar=1"
                  f"[bg{i}];"

                  "[fgsrc]"
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=decrease,"
                  "setsar=1"
                  f"[fg{i}];"

                  f"[bg{i}][fg{i}]"
                  "overlay="
                  "(W-w)/2:"
                  "(H-h)/2,"
                  "fps=30,"
                  "format=yuv420p,"
                  f"trim=duration={duration:.6f},"
                  "setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )


              # --------------------------------------------------------
              # AUDIO
              #
              # Audio begins at exactly the same local timestamp
              # as its corresponding visual.
              # --------------------------------------------------------

              audio_filter = (
                  f"[{audio_input_index}:a:0]"
                  f"atrim=duration={duration:.6f},"
                  "asetpts=PTS-STARTPTS,"
                  f"aresample={OUTPUT_AUDIO_RATE}:"
                  "async=1:first_pts=0,"
                  f"atrim=duration={duration:.6f},"
                  "asetpts=PTS-STARTPTS"
                  f"[a{i}]"
              )


              filter_parts.append(
                  visual_filter
              )

              filter_parts.append(
                  audio_filter
              )


              video_labels.append(
                  f"[v{i}]"
              )

              audio_labels.append(
                  f"[a{i}]"
              )


          # ============================================================
          # CONCAT A/V PAIRS
          #
          # [v0][a0]
          # [v1][a1]
          # [v2][a2]
          #
          # Each visual is permanently paired with its own narration.
          # ============================================================

          concat_inputs = ""


          for i in range(len(section_audio)):

              concat_inputs += (
                  f"[v{i}]"
                  f"[a{i}]"
              )


          concat_filter = (
              concat_inputs
              +
              f"concat="
              f"n={len(section_audio)}:"
              f"v=1:"
              f"a=1:"
              "unsafe=0"
              "[vout][aout]"
          )


          filter_complex = (
              ";".join(filter_parts)
              +
              ";"
              +
              concat_filter
          )


          # ============================================================
          # FINAL BASE VIDEO
          # ============================================================

          base_final = (
              OUT /
              "base-final.mp4"
          )


          print("")
          print(
              "================================================"
          )
          print(
              "RENDERING MASTER A/V TIMELINE"
          )
          print(
              "================================================"
          )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",

                  *input_args,

                  "-filter_complex",
                  filter_complex,

                  "-map",
                  "[vout]",
                  "-map",
                  "[aout]",

                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",

                  "-pix_fmt",
                  "yuv420p",

                  "-r",
                  str(FPS),

                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",

                  "-ar",
                  str(OUTPUT_AUDIO_RATE),
                  "-ac",
                  "1",

                  "-movflags",
                  "+faststart",

                  str(base_final)
              ],
              check=True
          )


          # ============================================================
          # MASTER A/V VALIDATION BEFORE SUBTITLES
          # ============================================================

          base_video_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-select_streams",
                      "v:0",
                      "-show_entries",
                      "stream=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(base_final)
                  ],
                  text=True
              ).strip()
          )


          base_audio_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-select_streams",
                      "a:0",
                      "-show_entries",
                      "stream=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(base_final)
                  ],
                  text=True
              ).strip()
          )


          base_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(base_final)
                  ],
                  text=True
              ).strip()
          )


          print(
              f"Base video duration: "
              f"{base_video_duration:.6f}s"
          )

          print(
              f"Base audio duration: "
              f"{base_audio_duration:.6f}s"
          )

          print(
              f"Base container duration: "
              f"{base_duration:.6f}s"
          )


          if abs(
              base_video_duration -
              base_audio_duration
          ) > FINAL_TOLERANCE:

              raise SystemExit(
                  "ERROR: Base A/V duration mismatch. "
                  f"video={base_video_duration:.6f}s "
                  f"audio={base_audio_duration:.6f}s"
              )


          # ============================================================
          # SUBTITLE TIMELINE
          # ============================================================

          def timestamp(seconds):

              total_ms = int(
                  round(
                      seconds * 1000
                  )
              )


              hours, remainder = divmod(
                  total_ms,
                  3600000
              )


              minutes, remainder = divmod(
                  remainder,
                  60000
              )


              seconds_int, milliseconds = divmod(
                  remainder,
                  1000
              )


              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{seconds_int:02d},"
                  f"{milliseconds:03d}"
              )


          def caption_chunks(text):

              words = text.split()

              if not words:
                  return []


              chunks = []
              current = []


              for word in words:

                  candidate = " ".join(
                      current + [word]
                  )


                  if current and (
                      len(current) >= 5
                      or len(candidate) > 34
                  ):

                      chunks.append(
                          " ".join(current)
                      )

                      current = [word]

                  else:

                      current.append(word)


              if current:
                  chunks.append(
                      " ".join(current)
                  )


              return chunks


          srt_path = (
              OUT /
              "captions.srt"
          )


          current_time = 0.0
          caption_number = 1


          with srt_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              for section in section_audio:

                  section_start = (
                      current_time
                  )


                  section_end = (
                      section_start +
                      section["duration"]
                  )


                  parts = caption_chunks(
                      section["narration"]
                  )


                  if not parts:
                      parts = [
                          section["narration"]
                      ]


                  weights = []


                  for part in parts:

                      count = len(
                          re.findall(
                              r"\b[\w'-]+\b",
                              part
                          )
                      )

                      weights.append(
                          max(
                              1,
                              count
                          )
                      )


                  total_weight = sum(
                      weights
                  )


                  local_time = (
                      section_start
                  )


                  for part, weight in zip(
                      parts,
                      weights
                  ):

                      part_duration = (
                          section["duration"]
                          *
                          weight
                          /
                          total_weight
                      )


                      start = (
                          local_time
                      )


                      end = min(
                          section_end,
                          local_time +
                          part_duration
                      )


                      f.write(
                          f"{caption_number}\n"
                          f"{timestamp(start)} --> "
                          f"{timestamp(end)}\n"
                          f"{part}\n\n"
                      )


                      caption_number += 1

                      local_time = end


                  current_time = (
                      section_end
                  )


          # ============================================================
          # BURN SUBTITLES
          # ============================================================

          final = pathlib.Path(
              "final-short.mp4"
          )


          subtitle_filter = (
              f"subtitles={srt_path}:"
              "force_style="
              "'FontName=DejaVu Sans,"
              "FontSize=20,"
              "Bold=1,"
              "PrimaryColour=&H00FFFFFF,"
              "OutlineColour=&H00000000,"
              "BorderStyle=1,"
              "Outline=3,"
              "Shadow=0,"
              "Alignment=2,"
              "MarginV=220'"
          )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",

                  "-i",
                  str(base_final),

                  "-vf",
                  subtitle_filter,

                  "-map",
                  "0:v:0",
                  "-map",
                  "0:a:0",

                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",

                  "-pix_fmt",
                  "yuv420p",

                  "-r",
                  str(FPS),

                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",

                  "-ar",
                  str(OUTPUT_AUDIO_RATE),
                  "-ac",
                  "1",

                  "-movflags",
                  "+faststart",

                  str(final)
              ],
              check=True
          )


          # ============================================================
          # FINAL VALIDATION
          # ============================================================

          final_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(final)
                  ],
                  text=True
              ).strip()
          )


          video_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-select_streams",
                      "v:0",
                      "-show_entries",
                      "stream=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(final)
                  ],
                  text=True
              ).strip()
          )


          audio_duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-select_streams",
                      "a:0",
                      "-show_entries",
                      "stream=duration",
                      "-of",
                      "default="
                      "noprint_wrappers=1:"
                      "nokey=1",
                      str(final)
                  ],
                  text=True
              ).strip()
          )


          size = final.stat().st_size


          print("")
          print(
              "================================================"
          )
          print(
              "FINAL VALIDATION"
          )
          print(
              "================================================"
          )


          print(
              f"Expected timeline: "
              f"{final_audio_duration:.6f}s"
          )


          print(
              f"Final container: "
              f"{final_duration:.6f}s"
          )


          print(
              f"Final video stream: "
              f"{video_duration:.6f}s"
          )


          print(
              f"Final audio stream: "
              f"{audio_duration:.6f}s"
          )


          print(
              f"Sections: "
              f"{len(section_audio)}"
          )


          print(
              f"File size: "
              f"{size} bytes"
          )


          if size <= 0:
              raise SystemExit(
                  "ERROR: final-short.mp4 is empty"
              )


          if final_duration < 29.5:
              raise SystemExit(
                  f"ERROR: Final video too short: "
                  f"{final_duration:.6f}s"
              )


          if final_duration > 60.5:
              raise SystemExit(
                  f"ERROR: Final video too long: "
                  f"{final_duration:.6f}s"
              )


          if abs(
              video_duration -
              audio_duration
          ) > FINAL_TOLERANCE:

              raise SystemExit(
                  "ERROR: FINAL A/V MISMATCH: "
                  f"video={video_duration:.6f}s "
                  f"audio={audio_duration:.6f}s"
              )


          if abs(
              final_duration -
              final_audio_duration
          ) > FINAL_TOLERANCE:

              raise SystemExit(
                  "ERROR: FINAL TIMELINE MISMATCH: "
                  f"expected={final_audio_duration:.6f}s "
                  f"actual={final_duration:.6f}s"
              )


          print("")
          print(
              "A/V SYNCHRONIZATION VALIDATION: PASSED"
          )


          print(
              "VIDEO READY:",
              final.resolve()
          )

          PY

          python3 render.py


      - name: Upload MP4 to Google Drive and append Sheet row
        if: success()
        continue-on-error: true

        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}

        run: |

          python3 - <<'PY'

          import datetime
          import json
          import os
          import sys


          required = [
              "GDRIVE_SERVICE_ACCOUNT_JSON",
              "GDRIVE_FOLDER_ID",
              "GOOGLE_SHEET_ID"
          ]


          missing = [
              name
              for name in required
              if not os.environ.get(name)
          ]


          if missing:

              print(
                  "WARNING: Missing Google secrets:",
                  ", ".join(missing)
              )

              print(
                  "Skipping Drive/Sheets upload."
              )

              sys.exit(0)


          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  json.loads(
                      os.environ[
                          "GDRIVE_SERVICE_ACCOUNT_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/drive",
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )


          sheets = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False
          )


          run_id = os.environ["RUN_ID"]
          topic = os.environ["TOPIC"]
          title = os.environ["TITLE"]


          metadata = {
              "name": f"{run_id}.mp4",
              "parents": [
                  os.environ["GDRIVE_FOLDER_ID"]
              ],
              "mimeType": "video/mp4"
          }


          media = MediaFileUpload(
              "final-short.mp4",
              mimetype="video/mp4",
              resumable=True,
              chunksize=8 * 1024 * 1024
          )


          uploaded = (
              drive.files()
              .create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,webViewLink"
              )
              .execute()
          )


          file_id = uploaded["id"]


          link = (
              uploaded.get("webViewLink")
              or
              f"https://drive.google.com/file/d/"
              f"{file_id}/view"
          )


          try:

              drive.permissions().create(
                  fileId=file_id,
                  body={
                      "type": "anyone",
                      "role": "reader"
                  },
                  fields="id"
              ).execute()


              link = (
                  f"https://drive.google.com/file/d/"
                  f"{file_id}/view"
              )


          except Exception as exc:

              print(
                  "WARNING: Could not enable public "
                  "Drive sharing:",
                  exc
              )


          sheet_range = (
              os.environ.get(
                  "GOOGLE_SHEET_RANGE"
              )
              or
              "Sheet1!A:F"
          )


          row = [[
              datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),

              run_id,

              title,

              topic,

              "DONE",

              link
          ]]


          (
              sheets.spreadsheets()
              .values()
              .append(
                  spreadsheetId=os.environ[
                      "GOOGLE_SHEET_ID"
                  ],
                  range=sheet_range,
                  valueInputOption="USER_ENTERED",
                  insertDataOption="INSERT_ROWS",
                  body={
                      "values": row
                  }
              )
              .execute()
          )


          print(
              "VIDEO_URL:",
              link
          )

          PY


      - name: Upload GitHub artifact backup
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: final-short-${{ github.run_id }}

          path: |
            final-short.mp4
            out/master_audio.wav
            out/captions.srt
            out/section_*.wav
            out/source_*.jpg
            out/source_*.mp4

          if-no-files-found: warn

          retention-days: 7
