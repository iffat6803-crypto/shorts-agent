name: Render Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run ID"
        required: true
        type: string

      topic:
        description: "Video topic"
        required: true
        type: string

      script:
        description: "Complete narration script"
        required: true
        type: string

      title:
        description: "Video title"
        required: true
        type: string

      visuals:
        description: "JSON array of per-section visual assets"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # SYSTEM PACKAGES
      # ==========================================================

      - name: Install system packages
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            espeak-ng \
            python3-pip

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1


      # ==========================================================
      # PYTHON PACKAGES
      # ==========================================================

      - name: Install Python packages
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip

          python3 -m pip install --no-cache-dir \
            "kokoro>=0.9.4" \
            soundfile \
            numpy \
            torch \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib


      # ==========================================================
      # VERIFY PYTHON
      # ==========================================================

      - name: Verify Python packages
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sys
          import numpy
          import soundfile
          import torch
          import kokoro

          print("Python:", sys.version)
          print("numpy:", numpy.__version__)
          print("soundfile:", soundfile.__version__)
          print("torch:", torch.__version__)
          print("kokoro:", getattr(kokoro, "__version__", "installed"))
          print("Python package verification: PASSED")
          PY


      # ==========================================================
      # SHOW INPUTS
      # ==========================================================

      - name: Show received inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          echo "Run ID: $RUN_ID"
          echo "Topic: $TOPIC"
          echo "Title: $TITLE"
          echo "Script words: $(printf '%s' "$SCRIPT" | wc -w)"


      # ==========================================================
      # MAIN RENDER
      # ==========================================================

      - name: Render Short
        env:
          RUN_ID: ${{ inputs.run_id }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}

        run: |

          set -euo pipefail

          cat > render.py <<'PY'

          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.request
          import urllib.parse

          import numpy as np
          import soundfile as sf

          from kokoro import KPipeline


          # ======================================================
          # CONFIG
          # ======================================================

          OUT = pathlib.Path("out")
          OUT.mkdir(parents=True, exist_ok=True)

          SCENES_DIR = OUT / "scenes"
          SCENES_DIR.mkdir(parents=True, exist_ok=True)

          SCRIPT = os.environ.get("SCRIPT", "").strip()
          VISUALS_RAW = os.environ.get("VISUALS_JSON", "").strip()

          SAMPLE_RATE = 24000
          OUTPUT_AUDIO_RATE = 48000

          FPS = 30

          WIDTH = 1080
          HEIGHT = 1920

          MIN_DURATION = 30.0
          MAX_DURATION = 60.0
          TARGET_MAX = 59.5

          SCENE_TOLERANCE = 0.20
          FINAL_TOLERANCE = 0.20

          MAX_VISUAL_DOWNLOAD_BYTES = 150 * 1024 * 1024


          # ======================================================
          # HELPERS
          # ======================================================

          def fail(message):
              raise SystemExit("ERROR: " + message)


          def run_command(command, description):
              print("")
              print("------------------------------------------------")
              print(description)
              print("------------------------------------------------")

              subprocess.run(command, check=True)


          def ffprobe_value(args):
              result = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      *args
                  ],
                  text=True
              ).strip()

              if not result:
                  fail(
                      "ffprobe returned no value for: "
                      + " ".join(args)
                  )

              try:
                  return float(result)

              except ValueError:
                  fail(
                      "ffprobe returned invalid numeric value: "
                      + result
                  )


          def get_duration(path):
              return ffprobe_value(
                  [
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ]
              )


          def get_video_duration(path):
              return ffprobe_value(
                  [
                      "-select_streams",
                      "v:0",
                      "-show_entries",
                      "stream=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ]
              )


          def get_audio_duration(path):
              return ffprobe_value(
                  [
                      "-select_streams",
                      "a:0",
                      "-show_entries",
                      "stream=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ]
              )


          def clean_text(value):
              if value is None:
                  return ""

              return str(value).strip()


          def canonical_url(url):
              if not url:
                  return ""

              try:
                  parsed = urllib.parse.urlsplit(url)

                  host = parsed.netloc.lower()
                  path = parsed.path.rstrip("/")

                  return (
                      parsed.scheme.lower()
                      + "://"
                      + host
                      + path
                  )

              except Exception:
                  return (
                      str(url)
                      .strip()
                      .lower()
                      .split("?")[0]
                      .rstrip("/")
                  )


          def get_visual_id(item):
              if not isinstance(item, dict):
                  return ""

              for key in (
                  "pexels_id",
                  "visual_id",
                  "asset_id",
                  "id"
              ):
                  value = item.get(key)

                  if value is not None:
                      value = str(value).strip()

                      if value:
                          return value

              return ""


          def get_url(item):
              if not isinstance(item, dict):
                  return None

              for key in (
                  "video_url",
                  "image_url",
                  "url",
                  "video",
                  "video_link",
                  "link",
                  "image",
                  "image_link",
                  "thumbnail"
              ):
                  value = item.get(key)

                  if isinstance(value, str):
                      value = value.strip()

                      if (
                          value.startswith("https://")
                          or
                          value.startswith("http://")
                      ):
                          return value

              return None


          def detect_is_image(content_type, url):
              content_type = (
                  content_type or ""
              ).lower()

              clean = (
                  url.lower()
                  .split("?")[0]
              )

              if content_type.startswith("image/"):
                  return True

              if clean.endswith(
                  (
                      ".jpg",
                      ".jpeg",
                      ".png",
                      ".webp",
                      ".gif"
                  )
              ):
                  return True

              return False


          def download_streaming(url, destination):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(compatible; ShortsRenderer/1.0)"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  content_type = (
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )

                  content_length = (
                      response.headers.get(
                          "Content-Length"
                      )
                  )

                  if content_length:

                      try:
                          content_length = int(
                              content_length
                          )

                          if (
                              content_length
                              >
                              MAX_VISUAL_DOWNLOAD_BYTES
                          ):
                              fail(
                                  "Visual is too large: "
                                  f"{content_length} bytes"
                              )

                      except ValueError:
                          pass

                  total = 0

                  with open(
                      destination,
                      "wb"
                  ) as output:

                      while True:

                          chunk = response.read(
                              1024 * 1024
                          )

                          if not chunk:
                              break

                          total += len(chunk)

                          if (
                              total
                              >
                              MAX_VISUAL_DOWNLOAD_BYTES
                          ):
                              output.close()

                              try:
                                  destination.unlink()
                              except Exception:
                                  pass

                              fail(
                                  "Visual download exceeded "
                                  f"{MAX_VISUAL_DOWNLOAD_BYTES} bytes"
                              )

                          output.write(chunk)

              if not destination.exists():
                  fail(
                      "Downloaded file does not exist: "
                      + str(destination)
                  )

              if destination.stat().st_size <= 0:
                  fail(
                      "Downloaded visual is empty: "
                      + str(destination)
                  )

              return content_type


          # ======================================================
          # BASIC VALIDATION
          # ======================================================

          if not SCRIPT:
              fail("SCRIPT is empty")

          if not VISUALS_RAW:
              fail("VISUALS_JSON is empty")


          # ======================================================
          # PARSE VISUALS
          # ======================================================

          try:
              visuals = json.loads(
                  VISUALS_RAW
              )

          except Exception as exc:
              fail(
                  "VISUALS is not valid JSON: "
                  + str(exc)
              )


          if isinstance(visuals, dict):
              visuals = (
                  visuals.get("visuals")
                  or
                  visuals.get("sections")
                  or
                  [visuals]
              )


          if not isinstance(visuals, list):
              fail(
                  "VISUALS must be a JSON array"
              )


          print(
              "Visual assets supplied:",
              len(visuals)
          )


          if len(visuals) < 2:
              fail(
                  "Fewer than 2 visual sections supplied"
              )


          if len(visuals) > 12:
              fail(
                  "More than 12 visual sections supplied"
              )


          # ======================================================
          # VALIDATE + SORT SECTION MAPPING
          # ======================================================

          section_inputs = []

          seen_indexes = set()
          seen_urls = set()
          seen_visual_ids = set()


          for fallback_index, item in enumerate(visuals):

              if not isinstance(item, dict):
                  fail(
                      f"Visual section {fallback_index + 1} "
                      "is not an object"
                  )


              raw_index = item.get(
                  "section_index"
              )

              if raw_index is None:
                  raw_index = item.get(
                      "index"
                  )

              if raw_index is None:
                  raw_index = fallback_index


              try:
                  section_index = int(
                      raw_index
                  )

              except Exception:
                  fail(
                      f"Invalid section_index: "
                      f"{raw_index}"
                  )


              if section_index in seen_indexes:
                  fail(
                      "Duplicate section_index detected: "
                      f"{section_index}"
                  )

              seen_indexes.add(
                  section_index
              )


              url = get_url(item)

              if not url:
                  fail(
                      f"Section {section_index + 1} "
                      "has no usable visual URL"
                  )


              normalized_url = canonical_url(
                  url
              )


              if normalized_url in seen_urls:
                  fail(
                      "DUPLICATE VISUAL DETECTED: "
                      + normalized_url
                  )

              seen_urls.add(
                  normalized_url
              )


              visual_id = get_visual_id(
                  item
              )


              if visual_id:

                  if visual_id in seen_visual_ids:
                      fail(
                          "DUPLICATE VISUAL ASSET ID: "
                          + visual_id
                      )

                  seen_visual_ids.add(
                      visual_id
                  )


              narration = clean_text(
                  item.get("narration")
                  or
                  item.get("text")
                  or
                  item.get("script")
              )


              query = clean_text(
                  item.get("query")
                  or
                  item.get("search_query")
              )


              if not narration:
                  fail(
                      f"Section {section_index + 1} "
                      "has no narration"
                  )


              section_inputs.append(
                  {
                      "section_index":
                          section_index,

                      "url":
                          url,

                      "canonical_url":
                          normalized_url,

                      "visual_id":
                          visual_id,

                      "narration":
                          narration,

                      "query":
                          query
                  }
              )


          section_inputs.sort(
              key=lambda x:
              x["section_index"]
          )


          expected_indexes = list(
              range(
                  len(section_inputs)
              )
          )


          actual_indexes = [
              item["section_index"]
              for item in section_inputs
          ]


          if actual_indexes != expected_indexes:
              fail(
                  "section_index values must be sequential "
                  "starting at 0. "
                  f"Received: {actual_indexes}"
              )


          print(
              "Section mapping validated:",
              actual_indexes
          )


          # ======================================================
          # DOWNLOAD ONE VISUAL PER SECTION
          # ======================================================

          downloaded = []


          for section in section_inputs:

              index = section[
                  "section_index"
              ]

              url = section[
                  "url"
              ]


              print("")
              print(
                  f"Downloading visual for section {index + 1}..."
              )


              destination = (
                  OUT /
                  f"source_{index}.bin"
              )


              success = False


              for attempt in range(1, 4):

                  try:

                      if destination.exists():
                          destination.unlink()


                      content_type = (
                          download_streaming(
                              url,
                              destination
                          )
                      )


                      is_image = detect_is_image(
                          content_type,
                          url
                      )


                      if is_image:
                          final_path = (
                              OUT /
                              f"source_{index}.jpg"
                          )

                      else:
                          final_path = (
                              OUT /
                              f"source_{index}.mp4"
                          )


                      if final_path.exists():
                          final_path.unlink()


                      destination.rename(
                          final_path
                      )


                      downloaded.append(
                          {
                              "section_index":
                                  index,

                              "path":
                                  final_path,

                              "kind":
                                  (
                                      "image"
                                      if is_image
                                      else
                                      "video"
                                  ),

                              "narration":
                                  section[
                                      "narration"
                                  ],

                              "query":
                                  section[
                                      "query"
                                  ],

                              "url":
                                  url,

                              "canonical_url":
                                  section[
                                      "canonical_url"
                                  ],

                              "visual_id":
                                  section[
                                      "visual_id"
                                  ]
                          }
                      )


                      print(
                          f"Section {index + 1}: "
                          f"{'IMAGE' if is_image else 'VIDEO'} "
                          f"{final_path.stat().st_size} bytes"
                      )


                      success = True
                      break


                  except Exception as exc:

                      print(
                          f"Section {index + 1}: "
                          f"download attempt {attempt} failed: {exc}"
                      )


              if not success:
                  fail(
                      f"Could not download visual "
                      f"for section {index + 1}"
                  )


          if len(downloaded) != len(
              section_inputs
          ):
              fail(
                  "Every narration section must have "
                  "exactly one visual"
              )


          # ======================================================
          # KOKORO TTS
          # ======================================================

          print("")
          print(
              "================================================"
          )
          print(
              "GENERATING SECTION-BY-SECTION NARRATION"
          )
          print(
              "================================================"
          )


          pipeline = KPipeline(
              lang_code="a"
          )


          section_audio = []


          for item in downloaded:

              index = item[
                  "section_index"
              ]


              print(
                  f"Generating audio for section {index + 1}..."
              )


              chunks = []


              for _, _, audio_chunk in pipeline(
                  item["narration"],
                  voice="af_heart",
                  speed=1.0
              ):

                  audio_chunk = np.asarray(
                      audio_chunk,
                      dtype=np.float32
                  ).reshape(-1)


                  if audio_chunk.size:
                      chunks.append(
                          audio_chunk
                      )


              if not chunks:
                  fail(
                      "Kokoro produced no audio "
                      f"for section {index + 1}"
                  )


              audio = np.concatenate(
                  chunks
              )


              raw_wav = (
                  OUT /
                  f"section_{index:02d}_raw.wav"
              )


              sf.write(
                  raw_wav,
                  audio,
                  SAMPLE_RATE
              )


              normalized_wav = (
                  OUT /
                  f"section_{index:02d}.wav"
              )


              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(raw_wav),
                      "-ar",
                      str(OUTPUT_AUDIO_RATE),
                      "-ac",
                      "1",
                      "-c:a",
                      "pcm_s16le",
                      str(normalized_wav)
                  ],
                  f"Normalizing audio section {index + 1}"
              )


              duration = get_duration(
                  normalized_wav
              )


              if duration <= 0:
                  fail(
                      f"Invalid audio duration "
                      f"for section {index + 1}"
                  )


              section_audio.append(
                  {
                      "section_index":
                          index,

                      "path":
                          normalized_wav,

                      "duration":
                          duration,

                      "narration":
                          item["narration"],

                      "visual":
                          item
                  }
              )


              print(
                  f"Section {index + 1} audio duration: "
                  f"{duration:.6f}s"
              )


              try:
                  raw_wav.unlink()
              except Exception:
                  pass


          # ======================================================
          # TOTAL AUDIO DURATION
          # ======================================================

          original_total = sum(
              item["duration"]
              for item in section_audio
          )


          print(
              f"Original audio total: "
              f"{original_total:.6f}s"
          )


          # ======================================================
          # TOO LONG -> UNIFORM ATEMPO
          # ======================================================

          if original_total > TARGET_MAX:

              factor = (
                  original_total /
                  TARGET_MAX
              )


              if factor > 2.0:
                  fail(
                      "Narration is too long. "
                      f"Required speed factor: {factor:.3f}x. "
                      "Maximum automatic factor is 2.0x. "
                      "Shorten the script."
                  )


              factor = max(
                  1.01,
                  factor
              )


              print(
                  f"Applying uniform audio speed factor: "
                  f"{factor:.6f}x"
              )


              for item in section_audio:

                  source = item[
                      "path"
                  ]

                  normalized = (
                      OUT /
                      f"section_"
                      f"{item['section_index']:02d}_speed.wav"
                  )


                  run_command(
                      [
                          "ffmpeg",
                          "-y",
                          "-i",
                          str(source),
                          "-af",
                          f"atempo={factor:.6f}",
                          "-ar",
                          str(OUTPUT_AUDIO_RATE),
                          "-ac",
                          "1",
                          "-c:a",
                          "pcm_s16le",
                          str(normalized)
                      ],
                      (
                          "Applying uniform speed to "
                          f"section {item['section_index'] + 1}"
                      )
                  )


                  new_duration = get_duration(
                      normalized
                  )


                  item["path"] = normalized
                  item["duration"] = new_duration


          # ======================================================
          # MINIMUM 30 SECONDS
          # ======================================================

          total_after_speed = sum(
              item["duration"]
              for item in section_audio
          )


          if total_after_speed < MIN_DURATION:

              padding = (
                  MIN_DURATION -
                  total_after_speed
              )


              last = section_audio[-1]


              padded = (
                  OUT /
                  f"section_"
                  f"{last['section_index']:02d}_padded.wav"
              )


              run_command(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(last["path"]),
                      "-af",
                      f"apad=pad_dur={padding:.6f}",
                      "-ar",
                      str(OUTPUT_AUDIO_RATE),
                      "-ac",
                      "1",
                      "-c:a",
                      "pcm_s16le",
                      str(padded)
                  ],
                  "Padding final audio section"
              )


              new_duration = get_duration(
                  padded
              )


              last["path"] = padded
              last["duration"] = new_duration


              print(
                  f"Added approximately "
                  f"{padding:.6f}s silence to final section"
              )


          final_audio_duration = sum(
              item["duration"]
              for item in section_audio
          )


          print(
              f"Final audio timeline: "
              f"{final_audio_duration:.6f}s"
          )


          if final_audio_duration > (
              MAX_DURATION + 0.05
          ):
              fail(
                  "Audio exceeds 60 seconds: "
                  f"{final_audio_duration:.6f}s"
              )


          if final_audio_duration < (
              MIN_DURATION - 0.10
          ):
              fail(
                  "Audio is below 30 seconds after "
                  f"normalization: {final_audio_duration:.6f}s"
              )


          # ======================================================
          # RENDER EACH COMPLETE A/V SCENE
          # ======================================================

          scene_files = []


          for item in section_audio:

              index = item[
                  "section_index"
              ]

              visual = item[
                  "visual"
              ]

              visual_path = visual[
                  "path"
              ]

              visual_kind = visual[
                  "kind"
              ]

              audio_path = item[
                  "path"
              ]

              duration = item[
                  "duration"
              ]


              scene_path = (
                  SCENES_DIR /
                  f"scene_{index:02d}.mp4"
              )


              print("")
              print(
                  "================================================"
              )
              print(
                  f"RENDERING SCENE {index + 1}"
              )
              print(
                  "================================================"
              )


              if visual_kind == "image":

                  input_args = [
                      "-loop",
                      "1",
                      "-framerate",
                      str(FPS),
                      "-i",
                      str(visual_path)
                  ]

              else:

                  input_args = [
                      "-stream_loop",
                      "-1",
                      "-i",
                      str(visual_path)
                  ]


              input_args += [
                  "-i",
                  str(audio_path)
              ]


              video_filter = (
                  "[0:v:0]"
                  "setpts=PTS-STARTPTS,"
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "boxblur=20:2,"
                  "setsar=1"
                  "[bg];"

                  "[0:v:0]"
                  "setpts=PTS-STARTPTS,"
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=decrease,"
                  "setsar=1"
                  "[fg];"

                  "[bg][fg]"
                  "overlay="
                  "(W-w)/2:"
                  "(H-h)/2,"
                  "fps=30,"
                  "format=yuv420p,"
                  f"trim=duration={duration:.6f},"
                  "setpts=PTS-STARTPTS"
                  "[v]"
              )


              audio_filter = (
                  "[1:a:0]"
                  "asetpts=PTS-STARTPTS,"
                  f"aresample={OUTPUT_AUDIO_RATE}:"
                  "async=1:first_pts=0,"
                  f"atrim=duration={duration:.6f},"
                  "asetpts=PTS-STARTPTS"
                  "[a]"
              )


              filter_complex = (
                  video_filter
                  + ";"
                  + audio_filter
              )


              run_command(
                  [
                      "ffmpeg",
                      "-y",

                      *input_args,

                      "-filter_complex",
                      filter_complex,

                      "-map",
                      "[v]",

                      "-map",
                      "[a]",

                      "-c:v",
                      "libx264",

                      "-preset",
                      "veryfast",

                      "-crf",
                      "23",

                      "-pix_fmt",
                      "yuv420p",

                      "-r",
                      str(FPS),

                      "-c:a",
                      "aac",

                      "-b:a",
                      "128k",

                      "-ar",
                      str(OUTPUT_AUDIO_RATE),

                      "-ac",
                      "1",

                      "-shortest",

                      "-t",
                      f"{duration:.6f}",

                      "-movflags",
                      "+faststart",

                      str(scene_path)
                  ],
                  f"Rendering scene {index + 1}"
              )


              # ==================================================
              # SCENE VALIDATION
              # ==================================================

              scene_video_duration = (
                  get_video_duration(
                      scene_path
                  )
              )

              scene_audio_duration = (
                  get_audio_duration(
                      scene_path
                  )
              )

              scene_container_duration = (
                  get_duration(
                      scene_path
                  )
              )


              print(
                  f"Scene {index + 1} video: "
                  f"{scene_video_duration:.6f}s"
              )

              print(
                  f"Scene {index + 1} audio: "
                  f"{scene_audio_duration:.6f}s"
              )

              print(
                  f"Scene {index + 1} container: "
                  f"{scene_container_duration:.6f}s"
              )


              scene_av_diff = abs(
                  scene_video_duration
                  -
                  scene_audio_duration
              )


              if scene_av_diff > SCENE_TOLERANCE:
                  fail(
                      f"SCENE {index + 1} A/V MISMATCH: "
                      f"video={scene_video_duration:.6f}s "
                      f"audio={scene_audio_duration:.6f}s "
                      f"difference={scene_av_diff:.6f}s"
                  )


              if abs(
                  scene_container_duration
                  -
                  scene_audio_duration
              ) > SCENE_TOLERANCE:
                  fail(
                      f"SCENE {index + 1} CONTAINER TIMELINE "
                      "MISMATCH: "
                      f"container={scene_container_duration:.6f}s "
                      f"audio={scene_audio_duration:.6f}s"
                  )


              print(
                  f"SCENE {index + 1} A/V VALIDATION: PASSED"
              )


              scene_files.append(
                  scene_path
              )


          # ======================================================
          # CONCATENATE COMPLETE A/V SCENES
          # ======================================================

          concat_file = (
              OUT /
              "scenes_concat.txt"
          )


          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:

              for scene in scene_files:

                  safe_path = (
                      str(scene.resolve())
                      .replace(
                          "'",
                          "'\\''"
                      )
                  )

                  f.write(
                      "file '"
                      + safe_path
                      + "'\n"
                  )


          base_final = (
              OUT /
              "base-final.mp4"
          )


          run_command(
              [
                  "ffmpeg",
                  "-y",

                  "-f",
                  "concat",

                  "-safe",
                  "0",

                  "-i",
                  str(concat_file),

                  "-map",
                  "0:v:0",

                  "-map",
                  "0:a:0",

                  "-c",
                  "copy",

                  "-avoid_negative_ts",
                  "make_zero",

                  "-movflags",
                  "+faststart",

                  str(base_final)
              ],
              "Concatenating synchronized A/V scenes"
          )


          # ======================================================
          # MASTER A/V VALIDATION
          # ======================================================

          base_video_duration = (
              get_video_duration(
                  base_final
              )
          )

          base_audio_duration = (
              get_audio_duration(
                  base_final
              )
          )

          base_duration = (
              get_duration(
                  base_final
              )
          )


          base_av_diff = abs(
              base_video_duration
              -
              base_audio_duration
          )


          print("")
          print(
              "================================================"
          )
          print(
              "MASTER A/V VALIDATION"
          )
          print(
              "================================================"
          )

          print(
              f"Base video duration: {base_video_duration:.6f}s"
          )

          print(
              f"Base audio duration: {base_audio_duration:.6f}s"
          )

          print(
              f"Base container duration: {base_duration:.6f}s"
          )


          if base_av_diff > FINAL_TOLERANCE:
              fail(
                  "MASTER A/V MISMATCH: "
                  f"video={base_video_duration:.6f}s "
                  f"audio={base_audio_duration:.6f}s "
                  f"difference={base_av_diff:.6f}s"
              )


          if base_duration < (
              MIN_DURATION - 0.20
          ):
              fail(
                  "Master video is shorter than 30 seconds: "
                  f"{base_duration:.6f}s"
              )


          if base_duration > (
              MAX_DURATION + 0.20
          ):
              fail(
                  "Master video exceeds 60 seconds: "
                  f"{base_duration:.6f}s"
              )


          print(
              "MASTER A/V SYNCHRONIZATION: PASSED"
          )


          # ======================================================
          # SUBTITLE TIMELINE
          # ======================================================

          def timestamp(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours, remainder = divmod(
                  total_ms,
                  3600000
              )

              minutes, remainder = divmod(
                  remainder,
                  60000
              )

              seconds_int, milliseconds = divmod(
                  remainder,
                  1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{seconds_int:02d},"
                  f"{milliseconds:03d}"
              )


          def caption_chunks(text):

              words = text.split()

              if not words:
                  return []


              chunks = []
              current = []


              for word in words:

                  candidate = " ".join(
                      current + [word]
                  )


                  if current and (
                      len(current) >= 5
                      or
                      len(candidate) > 34
                  ):

                      chunks.append(
                          " ".join(current)
                      )

                      current = [word]

                  else:

                      current.append(
                          word
                      )


              if current:
                  chunks.append(
                      " ".join(current)
                  )


              return chunks


          actual_scene_durations = []


          for scene_path in scene_files:

              actual_duration = (
                  get_duration(
                      scene_path
                  )
              )

              actual_scene_durations.append(
                  actual_duration
              )


          srt_path = (
              OUT /
              "captions.srt"
          )


          current_time = 0.0
          caption_number = 1


          with srt_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              for item, scene_duration in zip(
                  section_audio,
                  actual_scene_durations
              ):

                  section_start = current_time

                  section_end = (
                      section_start
                      +
                      scene_duration
                  )


                  parts = caption_chunks(
                      item["narration"]
                  )


                  if not parts:
                      parts = [
                          item["narration"]
                      ]


                  weights = []


                  for part in parts:

                      count = len(
                          re.findall(
                              r"\b[\w'-]+\b",
                              part
                          )
                      )

                      weights.append(
                          max(1, count)
                      )


                  total_weight = sum(
                      weights
                  )


                  local_time = section_start


                  for part, weight in zip(
                      parts,
                      weights
                  ):

                      part_duration = (
                          scene_duration
                          *
                          weight
                          /
                          total_weight
                      )


                      start = local_time

                      end = min(
                          section_end,
                          local_time + part_duration
                      )


                      f.write(
                          f"{caption_number}\n"
                          f"{timestamp(start)} --> "
                          f"{timestamp(end)}\n"
                          f"{part}\n\n"
                      )


                      caption_number += 1

                      local_time = end


                  current_time = section_end


          # ======================================================
          # BURN SUBTITLES
          # ======================================================

          final = pathlib.Path(
              "final-short.mp4"
          )


          subtitle_filter = (
              f"subtitles={srt_path}:"
              "force_style="
              "'FontName=DejaVu Sans,"
              "FontSize=20,"
              "Bold=1,"
              "PrimaryColour=&H00FFFFFF,"
              "OutlineColour=&H00000000,"
              "BorderStyle=1,"
              "Outline=3,"
              "Shadow=0,"
              "Alignment=2,"
              "MarginV=220'"
          )


          run_command(
              [
                  "ffmpeg",
                  "-y",

                  "-i",
                  str(base_final),

                  "-vf",
                  subtitle_filter,

                  "-map",
                  "0:v:0",

                  "-map",
                  "0:a:0",

                  "-c:v",
                  "libx264",

                  "-preset",
                  "veryfast",

                  "-crf",
                  "23",

                  "-pix_fmt",
                  "yuv420p",

                  "-r",
                  str(FPS),

                  "-c:a",
                  "copy",

                  "-shortest",

                  "-movflags",
                  "+faststart",

                  str(final)
              ],
              "Burning subtitles"
          )


          # ======================================================
          # FINAL VALIDATION
          # ======================================================

          if not final.exists():
              fail(
                  "final-short.mp4 was not created"
              )


          size = final.stat().st_size


          if size <= 0:
              fail(
                  "final-short.mp4 is empty"
              )


          final_duration = (
              get_duration(
                  final
              )
          )

          video_duration = (
              get_video_duration(
                  final
              )
          )

          audio_duration = (
              get_audio_duration(
                  final
              )
          )


          final_av_diff = abs(
              video_duration
              -
              audio_duration
          )


          fps_check = subprocess.check_output(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=r_frame_rate",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  str(final)
              ],
              text=True
          ).strip()


          audio_channels = subprocess.check_output(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-select_streams",
                  "a:0",
                  "-show_entries",
                  "stream=channels",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  str(final)
              ],
              text=True
          ).strip()


          print("")
          print(
              "================================================"
          )
          print(
              "FINAL VALIDATION"
          )
          print(
              "================================================"
          )

          print(
              f"Final container: {final_duration:.6f}s"
          )

          print(
              f"Final video stream: {video_duration:.6f}s"
          )

          print(
              f"Final audio stream: {audio_duration:.6f}s"
          )

          print(
              f"Final A/V difference: {final_av_diff:.6f}s"
          )

          print(
              f"Sections: {len(section_audio)}"
          )

          print(
              f"File size: {size} bytes"
          )

          print(
              f"Final FPS: {fps_check}"
          )

          print(
              f"Final audio channels: {audio_channels}"
          )


          if final_duration < (
              MIN_DURATION - 0.20
          ):
              fail(
                  "FINAL VIDEO TOO SHORT: "
                  f"{final_duration:.6f}s"
              )


          if final_duration > (
              MAX_DURATION + 0.20
          ):
              fail(
                  "FINAL VIDEO TOO LONG: "
                  f"{final_duration:.6f}s"
              )


          if final_av_diff > FINAL_TOLERANCE:
              fail(
                  "FINAL A/V MISMATCH: "
                  f"video={video_duration:.6f}s "
                  f"audio={audio_duration:.6f}s "
                  f"difference={final_av_diff:.6f}s"
              )


          if fps_check != "30/1":
              fail(
                  "FINAL VIDEO IS NOT 30 FPS: "
                  + fps_check
              )


          if audio_channels != "1":
              fail(
                  "FINAL AUDIO IS NOT MONO"
              )


          print("")
          print(
              "================================================"
          )
          print(
              "A/V SYNCHRONIZATION VALIDATION: PASSED"
          )
          print(
              "DUPLICATE VISUAL VALIDATION: PASSED"
          )
          print(
              "SECTION MAPPING VALIDATION: PASSED"
          )
          print(
              "30 FPS VALIDATION: PASSED"
          )
          print(
              "FINAL VIDEO READY"
          )
          print(
              "================================================"
          )


          print(
              "VIDEO READY:",
              final.resolve()
          )

          PY

