name: Kokoro TTS Test

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kokoro
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" soundfile

      - name: Generate voice
        run: |
          cat > tts_test.py <<'PY'
          from kokoro import KPipeline
          import soundfile as sf

          text = """
          Scientists just discovered something fascinating about our universe.
          And the strange part is that this discovery could change what we thought we knew.
          """

          pipeline = KPipeline(lang_code="a")

          audio_chunks = []

          for _, _, audio in pipeline(
              text,
              voice="af_heart",
              speed=1.0
          ):
              audio_chunks.append(audio)

          import numpy as np
          audio = np.concatenate(audio_chunks)

          sf.write("voice.wav", audio, 24000)
          print("Voice generated successfully.")

          PY

          python tts_test.py

      - name: Check audio
        run: |
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            voice.wav

      - name: Upload voice
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-voice-test
          path: voice.wav
