name: Render Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run ID"
        required: true
        type: string

      topic:
        description: "Video topic"
        required: true
        type: string

      script:
        description: "Complete narration script"
        required: true
        type: string

      title:
        description: "Video title"
        required: true
        type: string

      visuals:
        description: "JSON visual sections"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pip

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            "kokoro>=0.9.4" \
            soundfile \
            torch

      - name: Show received inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}
        run: |
          echo "Run ID: $RUN_ID"
          echo "Topic: $TOPIC"
          echo "Title: $TITLE"

          python3 - <<'PY'
          import os
          import json

          raw = os.environ["VISUALS_JSON"]

          data = json.loads(raw)

          print("Visual sections received:", len(data))

          for i, item in enumerate(data):
              print(f"Section {i}:")
              print("  query:", item.get("query"))
              print("  video_url:", bool(item.get("video_url")))
              print("  url:", bool(item.get("url")))
              print("  image_url:", bool(item.get("image_url")))
          PY

      - name: Render Short
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}

        run: |

          python3 - <<'PY'
          import os
          import json
          import re
          import subprocess
          import pathlib
          import urllib.request
          import urllib.error
          import math

          from kokoro import KPipeline
          import soundfile as sf


          # ============================================================
          # HELPERS
          # ============================================================

          def run(cmd):
              print("\nRUN:", " ".join(map(str, cmd)))
              subprocess.run(cmd, check=True)


          def probe_duration(path):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return float(result.stdout.strip())


          def timestamp(seconds):
              seconds = max(0.0, float(seconds))

              ms = int(round(seconds * 1000))

              hours = ms // 3600000
              ms %= 3600000

              minutes = ms // 60000
              ms %= 60000

              secs = ms // 1000
              millis = ms % 1000

              return f"{hours:02}:{minutes:02}:{secs:02},{millis:03}"


          def clean_text(text):
              if not text:
                  return ""

              text = str(text)

              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def make_caption_lines(text, max_words=4):
              words = clean_text(text).split()

              if not words:
                  return []

              lines = []

              for i in range(0, len(words), max_words):
                  lines.append(" ".join(words[i:i + max_words]))

              return lines


          # ============================================================
          # INPUTS
          # ============================================================

          run_id = os.environ["RUN_ID"]
          topic = os.environ["TOPIC"]
          script = clean_text(os.environ["SCRIPT"])

          raw_visuals = os.environ["VISUALS_JSON"]

          try:
              visuals = json.loads(raw_visuals)
          except Exception as e:
              raise SystemExit(
                  f"Invalid visuals JSON: {e}"
              )


          if not isinstance(visuals, list):
              raise SystemExit(
                  "Visuals input must be a JSON list."
              )


          if not script:
              raise SystemExit(
                  "Script is empty."
              )


          print("================================================")
          print("VIDEO RENDER")
          print("================================================")
          print("Run ID:", run_id)
          print("Topic:", topic)
          print("Visual sections:", len(visuals))
          print("================================================")


          # ============================================================
          # OUTPUT DIRECTORIES
          # ============================================================

          out = pathlib.Path("out")
          out.mkdir(exist_ok=True)

          sections_dir = out / "sections"
          sections_dir.mkdir(exist_ok=True)

          audio_dir = out / "audio"
          audio_dir.mkdir(exist_ok=True)

          visual_dir = out / "visuals"
          visual_dir.mkdir(exist_ok=True)


          # ============================================================
          # NORMALIZE VISUAL OBJECTS
          #
          # IMPORTANT:
          # n8n currently sends:
          #
          # video_url
          # image_url
          #
          # Older versions may send:
          #
          # url
          #
          # We support BOTH so this mismatch cannot break rendering.
          # ============================================================

          normalized = []

          for index, item in enumerate(visuals):

              if not isinstance(item, dict):
                  print(
                      f"Skipping invalid visual object {index}"
                  )
                  continue

              narration = clean_text(
                  item.get("narration")
                  or item.get("caption")
                  or ""
              )

              query = clean_text(
                  item.get("query")
                  or ""
              )

              video_url = (
                  item.get("video_url")
                  or item.get("url")
                  or item.get("video")
                  or ""
              )

              image_url = (
                  item.get("image_url")
                  or item.get("image")
                  or ""
              )

              video_url = str(video_url).strip()
              image_url = str(image_url).strip()

              print(f"\nVisual {index}:")
              print("  narration:", narration[:100])
              print("  query:", query)
              print("  video_url:", video_url[:150])
              print("  image_url:", image_url[:150])

              normalized.append(
                  {
                      "narration": narration,
                      "query": query,
                      "video_url": video_url,
                      "image_url": image_url
                  }
              )


          if not normalized:
              raise SystemExit(
                  "No valid visual sections were supplied."
              )


          # ============================================================
          # TTS
          #
          # Generate audio separately for every visual section.
          # This lets each visual change with its narration.
          # ============================================================

          pipeline = KPipeline(lang_code="a")

          audio_files = []
          section_durations = []


          # If section narration exists, use it.
          # Otherwise split the complete script across sections.

          section_texts = []

          supplied_narrations = [
              clean_text(x.get("narration", ""))
              for x in normalized
          ]

          supplied_narrations = [
              x for x in supplied_narrations if x
          ]


          if supplied_narrations:

              section_texts = supplied_narrations

          else:

              sentences = [
                  clean_text(x)
                  for x in re.split(
                      r"(?<=[.!?])\s+",
                      script
                  )
                  if clean_text(x)
              ]

              count = len(normalized)

              if count <= 0:
                  count = 1

              section_texts = [
                  []
                  for _ in range(count)
              ]

              for i, sentence in enumerate(sentences):
                  section_texts[
                      i % count
                  ].append(sentence)

              section_texts = [
                  " ".join(x)
                  for x in section_texts
              ]


          # Make sure every visual section has narration.
          while len(section_texts) < len(normalized):
              section_texts.append("")

          section_texts = section_texts[:len(normalized)]


          for i, text in enumerate(section_texts):

              text = clean_text(text)

              if not text:
                  continue

              wav_path = audio_dir / f"audio_{i}.wav"

              print(
                  f"\nGenerating voice for section {i + 1}"
              )

              chunks = []

              for _, _, audio in pipeline(
                  text,
                  voice="af_heart",
                  speed=1.0
              ):
                  chunks.append(audio)

              if not chunks:
                  raise SystemExit(
                      f"No TTS audio generated for section {i + 1}"
                  )

              import numpy as np

              audio = np.concatenate(chunks)

              sf.write(
                  wav_path,
                  audio,
                  24000
              )

              duration = probe_duration(wav_path)

              print(
                  f"Section {i + 1} audio: {duration:.2f}s"
              )

              audio_files.append(wav_path)
              section_durations.append(duration)


          if not audio_files:
              raise SystemExit(
                  "No audio sections were generated."
              )


          # ============================================================
          # CONCATENATE AUDIO
          # ============================================================

          audio_list = out / "audio_list.txt"

          with audio_list.open("w", encoding="utf-8") as f:

              for path in audio_files:

                  safe = str(path.resolve()).replace(
                      "'",
                      "'\\''"
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )


          full_audio = out / "voice.wav"

          run(
              [
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(audio_list),
                  "-c:a", "pcm_s16le",
                  str(full_audio)
              ]
          )


          original_duration = probe_duration(full_audio)

          print(
              f"\nOriginal voice duration: "
              f"{original_duration:.2f}s"
          )


          # ============================================================
          # KEEP FINAL VIDEO BETWEEN 30 AND 60 SECONDS
          #
          # Normal target is 30-60.
          # If slightly short, slow audio.
          # If slightly long, speed audio up.
          #
          # The script itself is never deleted.
          # ============================================================

          processed_audio = out / "voice_normalized.wav"

          if original_duration < 30.0:

              # Slow down enough to reach 30 seconds.
              factor = original_duration / 30.0

              # Avoid extreme slowdown.
              factor = max(0.70, factor)

              print(
                  f"Audio below 30s. "
                  f"Applying tempo factor {factor:.3f}"
              )

              run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i", str(full_audio),
                      "-filter:a",
                      f"atempo={factor:.6f}",
                      str(processed_audio)
                  ]
              )

              # If still below 30, add only the tiny remaining amount
              # of silence rather than failing the complete render.
              normalized_duration = probe_duration(
                  processed_audio
              )

              if normalized_duration < 30.0:

                  pad = 30.0 - normalized_duration

                  run(
                      [
                          "ffmpeg",
                          "-y",
                          "-i", str(processed_audio),
                          "-af",
                          (
                              f"apad=pad_dur={pad:.3f}"
                          ),
                          "-t", "30",
                          str(out / "voice_final.wav")
                      ]
                  )

                  final_audio = out / "voice_final.wav"

              else:

                  final_audio = processed_audio


          elif original_duration > 60.0:

              factor = original_duration / 60.0

              # FFmpeg atempo accepts 0.5-2.0 per filter.
              if factor > 2.0:

                  raise SystemExit(
                      "Script is far longer than 60 seconds. "
                      "The content generator must produce a shorter script."
                  )

              print(
                  f"Audio above 60s. "
                  f"Applying tempo factor {factor:.3f}"
              )

              run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i", str(full_audio),
                      "-filter:a",
                      f"atempo={factor:.6f}",
                      str(processed_audio)
                  ]
              )

              final_audio = processed_audio

          else:

              final_audio = full_audio


          final_duration = probe_duration(
              final_audio
          )

          print(
              f"Final audio duration: "
              f"{final_duration:.2f}s"
          )


          if final_duration < 30.0 or final_duration > 60.0:

              raise SystemExit(
                  f"Final audio duration "
                  f"{final_duration:.2f}s is outside "
                  f"the 30-60 second range."
              )


          # ============================================================
          # BUILD SECTION VISUALS
          #
          # Every section gets its own clip.
          # This fixes the previous "one image for whole video" problem.
          # ============================================================

          usable_visuals = []

          for i, item in enumerate(normalized):

              video_url = item["video_url"]
              image_url = item["image_url"]

              if not video_url and not image_url:

                  print(
                      f"Visual {i} has no video or image URL."
                  )

                  continue

              usable_visuals.append(
                  {
                      "index": i,
                      "video_url": video_url,
                      "image_url": image_url
                  }
              )


          if not usable_visuals:

              raise SystemExit(
                  "No visual assets contain video_url, url, "
                  "or image_url."
              )


          # ============================================================
          # DOWNLOAD + CREATE EACH SECTION
          # ============================================================

          section_clips = []

          accumulated = 0.0


          for visual_index, item in enumerate(normalized):

              if visual_index >= len(section_durations):

                  break

              section_duration = section_durations[
                  visual_index
              ]

              # Scale section duration proportionally if final audio
              # was tempo-normalized.
              if original_duration > 0:
                  section_duration = (
                      section_duration
                      * final_duration
                      / original_duration
                  )

              section_duration = max(
                  0.5,
                  section_duration
              )

              video_url = item["video_url"]
              image_url = item["image_url"]

              source_video = (
                  visual_dir /
                  f"source_{visual_index}.mp4"
              )

              source_image = (
                  visual_dir /
                  f"source_{visual_index}.jpg"
              )

              section_output = (
                  visual_dir /
                  f"section_{visual_index}.mp4"
              )


              # --------------------------------------------------------
              # VIDEO FIRST
              # --------------------------------------------------------

              downloaded_video = False

              if video_url:

                  print(
                      f"\nDownloading video "
                      f"for section {visual_index + 1}"
                  )

                  try:

                      run(
                          [
                              "curl",
                              "-L",
                              "--fail",
                              "--retry", "3",
                              "--retry-delay", "2",
                              "--connect-timeout", "20",
                              "--max-time", "120",
                              "-A",
                              "Mozilla/5.0",
                              "-o",
                              str(source_video),
                              video_url
                          ]
                      )

                      if (
                          source_video.exists()
                          and source_video.stat().st_size > 10000
                      ):

                          downloaded_video = True

                          print(
                              "Video downloaded successfully."
                          )

                  except Exception as e:

                      print(
                          "Video download failed:",
                          e
                      )


              # --------------------------------------------------------
              # IMAGE FALLBACK
              # --------------------------------------------------------

              if not downloaded_video and image_url:

                  print(
                      f"Trying image fallback "
                      f"for section {visual_index + 1}"
                  )

                  try:

                      run(
                          [
                              "curl",
                              "-L",
                              "--fail",
                              "--retry", "3",
                              "--retry-delay", "2",
                              "--connect-timeout", "20",
                              "--max-time", "60",
                              "-A",
                              "Mozilla/5.0",
                              "-o",
                              str(source_image),
                              image_url
                          ]
                      )

                      if (
                          source_image.exists()
                          and source_image.stat().st_size > 1000
                      ):

                          # Turn image into a video section.
                          run(
                              [
                                  "ffmpeg",
                                  "-y",
                                  "-loop", "1",
                                  "-i", str(source_image),
                                  "-t",
                                  f"{section_duration:.3f}",
                                  "-vf",
                                  (
                                      "scale=1080:1920:"
                                      "force_original_aspect_ratio=increase,"
                                      "crop=1080:1920,"
                                      "format=yuv420p"
                                  ),
                                  "-r", "30",
                                  "-an",
                                  "-c:v", "libx264",
                                  "-preset", "veryfast",
                                  "-crf", "24",
                                  str(section_output)
                              ]
                          )

                          section_clips.append(
                              section_output
                          )

                          accumulated += section_duration

                          continue

                  except Exception as e:

                      print(
                          "Image fallback failed:",
                          e
                      )


              # --------------------------------------------------------
              # VIDEO MUST EXIST
              # --------------------------------------------------------

              if not downloaded_video:

                  raise SystemExit(
                      f"No usable visual downloaded "
                      f"for section {visual_index + 1}. "
                      f"video_url and image_url both failed."
                  )


              # --------------------------------------------------------
              # CREATE PORTRAIT SECTION
              # --------------------------------------------------------

              run(
                  [
                      "ffmpeg",
                      "-y",
                      "-stream_loop", "-1",
                      "-i", str(source_video),
                      "-t",
                      f"{section_duration:.3f}",
                      "-vf",
                      (
                          "scale=1080:1920:"
                          "force_original_aspect_ratio=increase,"
                          "crop=1080:1920,"
                          "format=yuv420p"
                      ),
                      "-r", "30",
                      "-an",
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "23",
                      "-pix_fmt", "yuv420p",
                      str(section_output)
                  ]
              )

              section_clips.append(
                  section_output
              )

              accumulated += section_duration


          if not section_clips:

              raise SystemExit(
                  "No section videos were created."
              )


          # ============================================================
          # CONCAT VISUAL SECTIONS
          # ============================================================

          visual_list = out / "visual_list.txt"

          with visual_list.open("w", encoding="utf-8") as f:

              for path in section_clips:

                  safe = str(path.resolve()).replace(
                      "'",
                      "'\\''"
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )


          visuals_video = out / "visuals.mp4"

          run(
              [
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(visual_list),
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-pix_fmt", "yuv420p",
                  str(visuals_video)
              ]
          )


          # ============================================================
          # SUBTITLES
          #
          # Create captions from each narration section.
          # Maximum 4 words per caption.
          # Bottom safe area.
          # ============================================================

          subtitle_path = out / "captions.srt"

          subtitle_entries = []

          current_time = 0.0


          for i, text in enumerate(section_texts):

              text = clean_text(text)

              if not text:
                  continue

              if i >= len(section_durations):
                  break

              section_original = section_durations[i]

              if original_duration > 0:
                  section_final = (
                      section_original
                      * final_duration
                      / original_duration
                  )
              else:
                  section_final = section_original

              captions = make_caption_lines(
                  text,
                  max_words=4
              )

              if not captions:
                  continue

              step = (
                  section_final /
                  len(captions)
              )

              for j, caption in enumerate(captions):

                  start = current_time + (
                      j * step
                  )

                  end = current_time + (
                      (j + 1) * step
                  )

                  subtitle_entries.append(
                      (
                          start,
                          min(end, final_duration),
                          caption
                      )
                  )

              current_time += section_final


          with subtitle_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              for i, (
                  start,
                  end,
                  caption
              ) in enumerate(
                  subtitle_entries,
                  1
              ):

                  f.write(
                      f"{i}\n"
                  )

                  f.write(
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                  )

                  f.write(
                      f"{caption}\n\n"
                  )


          print(
              "\nSubtitle entries:",
              len(subtitle_entries)
          )


          # ============================================================
          # FINAL VIDEO
          #
          # 1080x1920 portrait
          # subtitles bottom-safe
          # audio complete
          # ============================================================

          final = out / "short.mp4"

          subtitle_filter = (
              "subtitles="
              f"{subtitle_path}:"
              "force_style="
              "'FontName=Arial,"
              "FontSize=16,"
              "Bold=1,"
              "PrimaryColour=&H00FFFFFF,"
              "OutlineColour=&H00000000,"
              "BackColour=&H80000000,"
              "BorderStyle=3,"
              "Outline=2,"
              "Shadow=0,"
              "Alignment=2,"
              "MarginL=80,"
              "MarginR=80,"
              "MarginV=170'"
          )


          run(
              [
                  "ffmpeg",
                  "-y",
                  "-i", str(visuals_video),
                  "-i", str(final_audio),
                  "-vf", subtitle_filter,
                  "-map", "0:v:0",
                  "-map", "1:a:0",
                  "-t", f"{final_duration:.3f}",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "22",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-movflags", "+faststart",
                  "-shortest",
                  str(final)
              ]
          )


          # ============================================================
          # VALIDATION
          # ============================================================

          video_duration = probe_duration(final)

          print(
              "\n=========================================="
          )

          print(
              f"FINAL VIDEO DURATION: "
              f"{video_duration:.2f}s"
          )

          print(
              f"FINAL VIDEO SIZE: "
              f"{final.stat().st_size} bytes"
          )

          print(
              "=========================================="
          )


          if not final.exists():
              raise SystemExit(
                  "Final video file was not created."
              )


          if final.stat().st_size < 100000:
              raise SystemExit(
                  "Final video file is suspiciously small."
              )


          if video_duration < 30.0:
              raise SystemExit(
                  f"Final video is only "
                  f"{video_duration:.2f}s."
              )


          if video_duration > 60.5:
              raise SystemExit(
                  f"Final video is "
                  f"{video_duration:.2f}s, "
                  f"above the 60s maximum."
              )


          print(
              "\nVIDEO RENDER SUCCESS"
          )

          print(
              "Output:",
              final
          )

          PY

      - name: Validate final video
        run: |

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            out/short.mp4)

          SIZE=$(stat -c%s out/short.mp4)

          echo "Final duration: ${DURATION} seconds"
          echo "Final size: ${SIZE} bytes"

          python3 - "$DURATION" "$SIZE" <<'PY'
          import sys

          duration = float(sys.argv[1])
          size = int(sys.argv[2])

          if size < 100000:
              raise SystemExit(
                  "ERROR: Final video file is too small."
              )

          if duration < 30:
              raise SystemExit(
                  f"ERROR: Video is only {duration:.2f}s. "
                  "Minimum is 30s."
              )

          if duration > 60.5:
              raise SystemExit(
                  f"ERROR: Video is {duration:.2f}s. "
                  "Maximum is 60s."
              )

          print(
              f"Video duration valid: {duration:.2f}s"
          )

          print(
              f"Video size valid: {size} bytes"
          )
          PY

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            out/short.mp4

          test -s out/short.mp4

      - name: Upload MP4 to Google Drive and log Sheet
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}

          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}

        run: |

          python3 - <<'PY'
          import os
          import json
          import datetime

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  json.loads(
                      os.environ[
                          "GDRIVE_SERVICE_ACCOUNT_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/drive",
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )

          sheets = build(
              "sheets",
              "v4",
              credentials=credentials
          )


          metadata = {
              "name":
                  f"{os.environ['RUN_ID']}.mp4",

              "parents":
                  [
                      os.environ[
                          "GDRIVE_FOLDER_ID"
                      ]
                  ]
          }


          media = MediaFileUpload(
              "out/short.mp4",
              mimetype="video/mp4",
              resumable=True
          )


          uploaded = (
              drive
              .files()
              .create(
                  body=metadata,
                  media_body=media,
                  fields="id,webViewLink,webContentLink"
              )
              .execute()
          )


          video_url = (
              uploaded.get("webViewLink")
              or uploaded.get("webContentLink")
              or ""
          )


          row = [
              [
                  datetime.datetime.now(
                      datetime.timezone.utc
                  ).isoformat(),

                  os.environ["RUN_ID"],

                  os.environ["TITLE"],

                  os.environ["TOPIC"],

                  "DONE",

                  video_url
              ]
          ]


          sheet_range = (
              os.environ.get(
                  "GOOGLE_SHEET_RANGE"
              )
              or "Sheet1!A:F"
          )


          (
              sheets
              .spreadsheets()
              .values()
              .append(
                  spreadsheetId=os.environ[
                      "GOOGLE_SHEET_ID"
                  ],

                  range=sheet_range,

                  valueInputOption="USER_ENTERED",

                  body={
                      "values": row
                  }
              )
              .execute()
          )


          print(
              "VIDEO URL:"
          )

          print(
              video_url
          )

          PY

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.run_id }}
          path: out/short.mp4
          if-no-files-found: error
