name: Render Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run ID"
        required: true
        type: string

      topic:
        description: "Video topic"
        required: true
        type: string

      script:
        description: "Complete narration script"
        required: true
        type: string

      title:
        description: "Video title"
        required: true
        type: string

      visuals:
        description: "JSON visual sections"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install system packages
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            curl \
            ca-certificates \
            python3-pip \
            python3-dev \
            build-essential

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            "kokoro>=0.9.4" \
            soundfile \
            torch \
            numpy \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib


      - name: Show received inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}
        run: |
          set -e

          echo "========================================"
          echo "RECEIVED INPUTS"
          echo "========================================"
          echo "Run ID: $RUN_ID"
          echo "Topic: $TOPIC"
          echo "Title: $TITLE"

          python3 - <<'PY'
          import os
          import json

          raw = os.environ["VISUALS_JSON"]

          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"Invalid visuals JSON: {e}")

          if isinstance(data, dict):
              data = [data]

          if not isinstance(data, list):
              raise SystemExit("Visuals must be a JSON list.")

          print("Visual sections received:", len(data))

          for i, item in enumerate(data):
              if not isinstance(item, dict):
                  print(f"Section {i + 1}: invalid object")
                  continue

              print(f"Section {i + 1}:")
              print("  narration:", bool(item.get("narration")))
              print("  query:", item.get("query", ""))
              print("  video_url:", bool(item.get("video_url")))
              print("  url:", bool(item.get("url")))
              print("  image_url:", bool(item.get("image_url")))
              print("  image:", bool(item.get("image")))
              print("  video_files:", bool(item.get("video_files")))

          print("========================================")
          PY


      - name: Render Short
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}

        run: |
          set -e

          python3 - <<'PY'
          import os
          import json
          import re
          import subprocess
          import pathlib
          import math

          import numpy as np
          import soundfile as sf

          from kokoro import KPipeline


          # ============================================================
          # HELPERS
          # ============================================================

          def run(cmd):
              print("\nRUN:", " ".join(map(str, cmd)))
              subprocess.run(cmd, check=True)


          def probe_duration(path):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              value = result.stdout.strip()

              if not value:
                  raise RuntimeError(f"Could not read duration: {path}")

              return float(value)


          def timestamp(seconds):
              seconds = max(0.0, float(seconds))

              total_ms = int(round(seconds * 1000))

              hours = total_ms // 3600000
              total_ms %= 3600000

              minutes = total_ms // 60000
              total_ms %= 60000

              secs = total_ms // 1000
              millis = total_ms % 1000

              return (
                  f"{hours:02d}:{minutes:02d}:"
                  f"{secs:02d},{millis:03d}"
              )


          def clean_text(text):
              if not text:
                  return ""

              text = str(text)
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def caption_lines(text, max_words=4):
              words = clean_text(text).split()

              if not words:
                  return []

              return [
                  " ".join(words[i:i + max_words])
                  for i in range(0, len(words), max_words)
              ]


          def first_video_url(value):
              """
              Accepts several possible Pexels/n8n formats:
              - direct string
              - dict containing url
              - list of video file dictionaries
              """

              if not value:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  direct = (
                      value.get("url")
                      or value.get("link")
                      or value.get("src")
                      or ""
                  )

                  if direct:
                      return str(direct).strip()

                  files = value.get("video_files")

                  if files:
                      return first_video_url(files)

                  return ""

              if isinstance(value, list):
                  candidates = []

                  for item in value:
                      if not isinstance(item, dict):
                          continue

                      url = (
                          item.get("link")
                          or item.get("url")
                          or item.get("src")
                          or ""
                      )

                      if url:
                          width = item.get("width") or 0
                          height = item.get("height") or 0

                          try:
                              width = int(width)
                              height = int(height)
                          except Exception:
                              width = 0
                              height = 0

                          portrait = height >= width if width else False

                          candidates.append(
                              (
                                  1 if portrait else 0,
                                  height,
                                  width,
                                  str(url).strip()
                              )
                          )

                  if candidates:
                      candidates.sort(reverse=True)
                      return candidates[0][3]

              return ""


          def first_image_url(value):
              if not value:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  for key in (
                      "url",
                      "src",
                      "image",
                      "image_url"
                  ):
                      if value.get(key):
                          return str(value[key]).strip()

              if isinstance(value, list):
                  for item in value:
                      result = first_image_url(item)

                      if result:
                          return result

              return ""


          # ============================================================
          # INPUTS
          # ============================================================

          run_id = os.environ["RUN_ID"]
          topic = clean_text(os.environ["TOPIC"])
          script = clean_text(os.environ["SCRIPT"])

          raw_visuals = os.environ["VISUALS_JSON"]

          if not script:
              raise SystemExit("Script is empty.")

          try:
              visuals = json.loads(raw_visuals)
          except Exception as e:
              raise SystemExit(
                  f"Invalid visuals JSON: {e}"
              )

          if isinstance(visuals, dict):
              visuals = [visuals]

          if not isinstance(visuals, list):
              raise SystemExit(
                  "Visuals input must be a JSON list."
              )

          if not visuals:
              raise SystemExit(
                  "No visual sections were supplied."
              )


          print("========================================")
          print("VIDEO RENDER")
          print("========================================")
          print("Run ID:", run_id)
          print("Topic:", topic)
          print("Visual sections:", len(visuals))
          print("========================================")


          # ============================================================
          # DIRECTORIES
          # ============================================================

          out = pathlib.Path("out")
          out.mkdir(exist_ok=True)

          audio_dir = out / "audio"
          audio_dir.mkdir(exist_ok=True)

          visual_dir = out / "visuals"
          visual_dir.mkdir(exist_ok=True)


          # ============================================================
          # NORMALIZE VISUALS
          # ============================================================

          normalized = []

          for index, item in enumerate(visuals):

              if isinstance(item, str):
                  item = {
                      "video_url": item
                  }

              if not isinstance(item, dict):
                  print(
                      f"Skipping invalid visual object "
                      f"{index + 1}"
                  )
                  continue

              narration = clean_text(
                  item.get("narration")
                  or item.get("caption")
                  or ""
              )

              query = clean_text(
                  item.get("query")
                  or ""
              )

              video_url = (
                  first_video_url(item.get("video_url"))
                  or first_video_url(item.get("url"))
                  or first_video_url(item.get("video"))
                  or first_video_url(item.get("video_files"))
              )

              image_url = (
                  first_image_url(item.get("image_url"))
                  or first_image_url(item.get("image"))
                  or first_image_url(item.get("image_url"))
              )

              normalized.append(
                  {
                      "narration": narration,
                      "query": query,
                      "video_url": video_url,
                      "image_url": image_url
                  }
              )

              print(f"\nVisual {index + 1}")
              print("  Query:", query)
              print("  Video:", bool(video_url))
              print("  Image:", bool(image_url))


          if not normalized:
              raise SystemExit(
                  "No valid visual objects supplied."
              )


          # ============================================================
          # BUILD SECTION NARRATION
          # ============================================================

          section_texts = [
              clean_text(x["narration"])
              for x in normalized
          ]

          # If n8n didn't provide narration per section,
          # divide the full script across the sections.
          if not any(section_texts):

              sentences = [
                  clean_text(x)
                  for x in re.split(
                      r"(?<=[.!?])\s+",
                      script
                  )
                  if clean_text(x)
              ]

              section_texts = [
                  []
                  for _ in normalized
              ]

              for i, sentence in enumerate(sentences):
                  section_texts[
                      i % len(section_texts)
                  ].append(sentence)

              section_texts = [
                  " ".join(x)
                  for x in section_texts
              ]


          # ============================================================
          # TTS
          # ============================================================

          print("\nGenerating Kokoro narration...")

          pipeline = KPipeline(lang_code="a")

          audio_files = []
          section_durations = []

          for i, text in enumerate(section_texts):

              text = clean_text(text)

              if not text:
                  continue

              wav_path = (
                  audio_dir /
                  f"section_{i}.wav"
              )

              chunks = []

              for _, _, audio in pipeline(
                  text,
                  voice="af_heart",
                  speed=1.0
              ):
                  chunks.append(audio)

              if not chunks:
                  raise SystemExit(
                      f"No TTS audio generated "
                      f"for section {i + 1}."
                  )

              audio = np.concatenate(chunks)

              sf.write(
                  wav_path,
                  audio,
                  24000
              )

              duration = probe_duration(
                  wav_path
              )

              print(
                  f"Section {i + 1} audio: "
                  f"{duration:.2f}s"
              )

              audio_files.append(wav_path)
              section_durations.append(duration)


          if not audio_files:
              raise SystemExit(
                  "No audio sections were generated."
              )


          # ============================================================
          # CONCAT AUDIO
          # ============================================================

          audio_list = (
              out / "audio_list.txt"
          )

          with audio_list.open(
              "w",
              encoding="utf-8"
          ) as f:

              for path in audio_files:

                  safe = (
                      str(path.resolve())
                      .replace("'", "'\\''")
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )


          full_audio = (
              out / "voice.wav"
          )

          run(
              [
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(audio_list),
                  "-c:a", "pcm_s16le",
                  str(full_audio)
              ]
          )


          original_duration = probe_duration(
              full_audio
          )

          print(
              "\nOriginal narration duration:",
              f"{original_duration:.2f}s"
          )


          # ============================================================
          # NORMALIZE FINAL DURATION
          #
          # Minimum 30 sec
          # Maximum 60 sec
          #
          # We do NOT simply cut the narration at 60 seconds.
          # ============================================================

          processed_audio = (
              out / "voice_normalized.wav"
          )

          if original_duration < 30.0:

              # Slow down moderately.
              factor = max(
                  0.70,
                  original_duration / 30.0
              )

              print(
                  "Narration below 30 sec."
              )

              print(
                  "Tempo factor:",
                  factor
              )

              run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i", str(full_audio),
                      "-filter:a",
                      f"atempo={factor:.6f}",
                      str(processed_audio)
                  ]
              )

              normalized_duration = probe_duration(
                  processed_audio
              )

              if normalized_duration < 30.0:

                  pad = (
                      30.0 -
                      normalized_duration
                  )

                  final_audio = (
                      out /
                      "voice_final.wav"
                  )

                  run(
                      [
                          "ffmpeg",
                          "-y",
                          "-i",
                          str(processed_audio),
                          "-af",
                          f"apad=pad_dur={pad:.3f}",
                          "-t", "30",
                          str(final_audio)
                      ]
                  )

              else:
                  final_audio = processed_audio


          elif original_duration > 60.0:

              # Speed up narration so the complete narration
              # remains within the Shorts limit.
              factor = (
                  original_duration /
                  60.0
              )

              # atempo supports 0.5-2.0.
              if factor > 2.0:

                  # A very long script should not be destroyed
                  # by extreme acceleration.
                  raise SystemExit(
                      "Script is longer than "
                      "120 seconds. Generate a shorter "
                      "short-form script."
                  )

              print(
                  "Narration above 60 sec."
              )

              print(
                  "Tempo factor:",
                  factor
              )

              run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i", str(full_audio),
                      "-filter:a",
                      f"atempo={factor:.6f}",
                      str(processed_audio)
                  ]
              )

              final_audio = processed_audio


          else:

              final_audio = full_audio


          final_duration = probe_duration(
              final_audio
          )

          print(
              "Final narration duration:",
              f"{final_duration:.2f}s"
          )


          if (
              final_duration < 30.0
              or final_duration > 60.0
          ):
              raise SystemExit(
                  "Final narration duration is "
                  "outside the allowed 30-60 second range."
              )


          # ============================================================
          # DOWNLOAD VISUALS
          #
          # One section = one visual.
          #
          # Video first.
          # Image second.
          # ============================================================

          section_clips = []

          current_audio_time = 0.0

          for i, item in enumerate(normalized):

              if i >= len(section_durations):
                  break

              original_section_duration = (
                  section_durations[i]
              )

              if original_duration > 0:

                  section_duration = (
                      original_section_duration
                      * final_duration
                      / original_duration
                  )

              else:
                  section_duration = (
                      original_section_duration
                  )

              section_duration = max(
                  0.5,
                  section_duration
              )


              video_url = item["video_url"]
              image_url = item["image_url"]


              source_video = (
                  visual_dir /
                  f"source_{i}.mp4"
              )

              source_image = (
                  visual_dir /
                  f"source_{i}.jpg"
              )

              section_output = (
                  visual_dir /
                  f"section_{i}.mp4"
              )


              downloaded_video = False


              # --------------------------------------------------------
              # VIDEO
              # --------------------------------------------------------

              if video_url:

                  print(
                      f"\nDownloading video "
                      f"for section {i + 1}"
                  )

                  try:

                      run(
                          [
                              "curl",
                              "-L",
                              "--fail",
                              "--silent",
                              "--show-error",
                              "--retry", "3",
                              "--retry-delay", "2",
                              "--connect-timeout", "20",
                              "--max-time", "120",
                              "-A",
                              "Mozilla/5.0",
                              "-o",
                              str(source_video),
                              video_url
                          ]
                      )

                      if (
                          source_video.exists()
                          and
                          source_video.stat().st_size
                          > 10000
                      ):

                          downloaded_video = True

                          print(
                              "Video downloaded."
                          )

                  except Exception as e:

                      print(
                          "Video download failed:",
                          e
                      )


              # --------------------------------------------------------
              # IMAGE FALLBACK
              # --------------------------------------------------------

              if (
                  not downloaded_video
                  and image_url
              ):

                  print(
                      f"Trying image fallback "
                      f"for section {i + 1}"
                  )

                  try:

                      run(
                          [
                              "curl",
                              "-L",
                              "--fail",
                              "--silent",
                              "--show-error",
                              "--retry", "3",
                              "--retry-delay", "2",
                              "--connect-timeout", "20",
                              "--max-time", "60",
                              "-A",
                              "Mozilla/5.0",
                              "-o",
                              str(source_image),
                              image_url
                          ]
                      )

                      if (
                          source_image.exists()
                          and
                          source_image.stat().st_size
                          > 1000
                      ):

                          run(
                              [
                                  "ffmpeg",
                                  "-y",
                                  "-loop", "1",
                                  "-i",
                                  str(source_image),
                                  "-t",
                                  f"{section_duration:.3f}",
                                  "-vf",
                                  (
                                      "scale=1080:1920:"
                                      "force_original_aspect_ratio=increase,"
                                      "crop=1080:1920,"
                                      "format=yuv420p"
                                  ),
                                  "-r", "30",
                                  "-an",
                                  "-c:v", "libx264",
                                  "-preset", "veryfast",
                                  "-crf", "24",
                                  "-pix_fmt", "yuv420p",
                                  str(section_output)
                              ]
                          )

                          section_clips.append(
                              section_output
                          )

                          print(
                              "Image fallback converted "
                              "to video."
                          )

                          continue

                  except Exception as e:

                      print(
                          "Image fallback failed:",
                          e
                      )


              # --------------------------------------------------------
              # NO ASSET
              # --------------------------------------------------------

              if not downloaded_video:

                  raise SystemExit(
                      f"No usable visual for section "
                      f"{i + 1}. "
                      f"Pexels must provide video_url "
                      f"or image_url."
                  )


              # --------------------------------------------------------
              # CREATE VIDEO SECTION
              # --------------------------------------------------------

              run(
                  [
                      "ffmpeg",
                      "-y",
                      "-stream_loop", "-1",
                      "-i", str(source_video),
                      "-t",
                      f"{section_duration:.3f}",
                      "-vf",
                      (
                          "scale=1080:1920:"
                          "force_original_aspect_ratio=increase,"
                          "crop=1080:1920,"
                          "format=yuv420p"
                      ),
                      "-r", "30",
                      "-an",
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "23",
                      "-pix_fmt", "yuv420p",
                      str(section_output)
                  ]
              )

              section_clips.append(
                  section_output
              )


          if not section_clips:
              raise SystemExit(
                  "No section videos were created."
              )


          # ============================================================
          # CONCAT VISUAL SECTIONS
          # ============================================================

          visual_list = (
              out / "visual_list.txt"
          )

          with visual_list.open(
              "w",
              encoding="utf-8"
          ) as f:

              for path in section_clips:

                  safe = (
                      str(path.resolve())
                      .replace("'", "'\\''")
                  )

                  f.write(
                      f"file '{safe}'\n"
                  )


          visuals_video = (
              out / "visuals.mp4"
          )

          run(
              [
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", str(visual_list),
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-pix_fmt", "yuv420p",
                  str(visuals_video)
              ]
          )


          # ============================================================
          # SUBTITLES
          #
          # Bottom safe area.
          # No giant center-screen text.
          # 4 words maximum per caption.
          # ============================================================

          subtitle_path = (
              out / "captions.srt"
          )

          subtitle_entries = []

          current_time = 0.0


          for i, text in enumerate(section_texts):

              text = clean_text(text)

              if not text:
                  continue

              if i >= len(section_durations):
                  break

              original_section = (
                  section_durations[i]
              )

              if original_duration > 0:

                  section_final = (
                      original_section
                      * final_duration
                      / original_duration
                  )

              else:

                  section_final = (
                      original_section
                  )


              captions = caption_lines(
                  text,
                  max_words=4
              )

              if not captions:
                  continue


              step = (
                  section_final /
                  len(captions)
              )


              for j, caption in enumerate(
                  captions
              ):

                  start = (
                      current_time
                      + j * step
                  )

                  end = (
                      current_time
                      + (j + 1) * step
                  )

                  subtitle_entries.append(
                      (
                          start,
                          min(
                              end,
                              final_duration
                          ),
                          caption
                      )
                  )


              current_time += section_final


          with subtitle_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              for index, (
                  start,
                  end,
                  caption
              ) in enumerate(
                  subtitle_entries,
                  1
              ):

                  f.write(
                      f"{index}\n"
                  )

                  f.write(
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                  )

                  f.write(
                      f"{caption}\n\n"
                  )


          # ============================================================
          # FINAL VIDEO
          # ============================================================

          final = (
              out / "short.mp4"
          )


          subtitle_filter = (
              f"subtitles={subtitle_path}:"
              "force_style="
              "'FontName=Arial,"
              "FontSize=16,"
              "Bold=1,"
              "Outline=2,"
              "Shadow=0,"
              "Alignment=2,"
              "MarginV=150,"
              "BorderStyle=1,"
              "Spacing=0'"
          )


          run(
              [
                  "ffmpeg",
                  "-y",
                  "-i", str(visuals_video),
                  "-i", str(final_audio),

                  "-vf",
                  subtitle_filter,

                  "-map", "0:v:0",
                  "-map", "1:a:0",

                  "-t",
                  f"{final_duration:.3f}",

                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "22",

                  "-c:a", "aac",
                  "-b:a", "128k",

                  "-pix_fmt", "yuv420p",

                  "-movflags", "+faststart",

                  "-shortest",

                  str(final)
              ]
          )


          # ============================================================
          # FINAL VALIDATION
          # ============================================================

          if not final.exists():
              raise SystemExit(
                  "Final video was not created."
              )

          if final.stat().st_size < 10000:
              raise SystemExit(
                  "Final video file is unexpectedly small."
              )


          actual_duration = probe_duration(
              final
          )

          print(
              "\n========================================"
          )

          print(
              "FINAL VIDEO CREATED"
          )

          print(
              "Path:",
              final
          )

          print(
              "Duration:",
              f"{actual_duration:.2f}s"
          )

          print(
              "Size:",
              final.stat().st_size,
              "bytes"
          )

          print(
              "========================================"
          )


          if (
              actual_duration < 30.0
              or actual_duration > 60.0
          ):

              raise SystemExit(
                  f"Final video is "
                  f"{actual_duration:.2f}s. "
                  f"Allowed range is 30-60s."
              )


          print(
              f"Video duration valid: "
              f"{actual_duration:.2f}s"
          )

          PY


      - name: Upload MP4 to Google Drive and log Sheet
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}

          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}

        run: |
          set -e

          python3 - <<'PY'
          import os
          import json
          import datetime

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # ============================================================
          # VALIDATE REQUIRED SECRETS
          # ============================================================

          required = [
              "GDRIVE_SERVICE_ACCOUNT_JSON",
              "GDRIVE_FOLDER_ID",
              "GOOGLE_SHEET_ID"
          ]

          for name in required:

              value = os.environ.get(name, "").strip()

              if not value:
                  raise SystemExit(
                      f"Missing required GitHub secret: {name}"
                  )


          # ============================================================
          # GOOGLE AUTH
          # ============================================================

          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  json.loads(
                      os.environ[
                          "GDRIVE_SERVICE_ACCOUNT_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/drive",
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )

          sheets = build(
              "sheets",
              "v4",
              credentials=credentials
          )


          # ============================================================
          # UPLOAD VIDEO
          # ============================================================

          metadata = {
              "name":
                  f"{os.environ['RUN_ID']}.mp4",

              "parents":
                  [
                      os.environ[
                          "GDRIVE_FOLDER_ID"
                      ]
                  ]
          }


          media = MediaFileUpload(
              "out/short.mp4",
              mimetype="video/mp4",
              resumable=True
          )


          uploaded = (
              drive
              .files()
              .create(
                  body=metadata,
                  media_body=media,
                  fields="id,webViewLink,webContentLink"
              )
              .execute()
          )


          video_url = (
              uploaded.get("webViewLink")
              or uploaded.get("webContentLink")
              or ""
          )


          if not video_url:

              raise SystemExit(
                  "Google Drive upload succeeded "
                  "but no video URL was returned."
              )


          print(
              "VIDEO URL:"
          )

          print(
              video_url
          )


          # ============================================================
          # SHEET LOG
          # ============================================================

          row = [
              [
                  datetime.datetime.now(
                      datetime.timezone.utc
                  ).isoformat(),

                  os.environ["RUN_ID"],

                  os.environ["TITLE"],

                  os.environ["TOPIC"],

                  "DONE",

                  video_url
              ]
          ]


          sheet_range = (
              os.environ.get(
                  "GOOGLE_SHEET_RANGE",
                  ""
              ).strip()
              or "Sheet1!A:F"
          )


          (
              sheets
              .spreadsheets()
              .values()
              .append(
                  spreadsheetId=os.environ[
                      "GOOGLE_SHEET_ID"
                  ],

                  range=sheet_range,

                  valueInputOption="USER_ENTERED",

                  insertDataOption="INSERT_ROWS",

                  body={
                      "values": row
                  }
              )
              .execute()
          )


          print(
              "Google Sheet row added successfully."
          )

          PY


      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4

        with:
          name: short-${{ inputs.run_id }}

          path: out/short.mp4

          if-no-files-found: error

          retention-days: 7
