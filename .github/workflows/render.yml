name: Pexels Test

on:
  workflow_dispatch:

jobs:
  pexels:
    runs-on: ubuntu-latest

    steps:
      - name: Search Pexels vertical video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          curl -fL \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/v1/videos/search?query=space%20science&orientation=portrait&size=medium&per_page=5" \
            -o pexels.json

          python - <<'PY'
          import json
          d=json.load(open("pexels.json"))
          videos=d.get("videos",[])
          if not videos:
              raise SystemExit("ERROR: No Pexels videos found")

          print("Pexels OK")
          print("Videos found:", len(videos))

          v=videos[0]
          files=[f for f in v.get("video_files",[]) if f.get("link")]
          if not files:
              raise SystemExit("ERROR: No downloadable video file")

          f=max(files,key=lambda x:(x.get("width",0)*x.get("height",0)))
          print("Video URL found")
          print("Resolution:",f.get("width"),"x",f.get("height"))
          print("Duration:",v.get("duration"))
          PY

      - name: Download test video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          URL=$(python - <<'PY'
          import json
          d=json.load(open("pexels.json"))
          v=d["videos"][0]
          files=[f for f in v["video_files"] if f.get("link")]
          f=max(files,key=lambda x:x.get("width",0)*x.get("height",0))
          print(f["link"])
          PY
          )

          curl -fL --retry 3 --retry-delay 5 "$URL" -o pexels-test.mp4

      - name: Validate video
        run: |
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            pexels-test.mp4

      - name: Upload test
        uses: actions/upload-artifact@v4
        with:
          name: pexels-test-video
          path: pexels-test.mp4
