      # ==========================================================
      # GOOGLE DRIVE + GOOGLE SHEETS
      # ==========================================================

      - name: Upload MP4 to Google Drive and append Sheet row
        if: success()

        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}

          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}

        run: |

          set -euo pipefail

          python3 - <<'PY'

          import datetime
          import json
          import os


          # ======================================================
          # REQUIRED CONFIG
          # ======================================================

          required = [
              "GDRIVE_SERVICE_ACCOUNT_JSON",
              "GOOGLE_SHEET_ID"
          ]


          missing = [
              name
              for name in required
              if not os.environ.get(name)
          ]


          if missing:

              print("")
              print(
                  "================================================"
              )
              print(
                  "GOOGLE CONFIGURATION ERROR"
              )
              print(
                  "================================================"
              )

              print(
                  "Missing required GitHub Actions secrets:"
              )

              for name in missing:
                  print(" - " + name)

              print(
                  "================================================"
              )

              raise SystemExit(1)


          if not os.path.exists(
              "final-short.mp4"
          ):
              raise SystemExit(
                  "ERROR: final-short.mp4 does not exist"
              )


          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          # ======================================================
          # SERVICE ACCOUNT
          # ======================================================

          try:

              service_account_info = json.loads(
                  os.environ[
                      "GDRIVE_SERVICE_ACCOUNT_JSON"
                  ]
              )

          except json.JSONDecodeError as exc:

              raise SystemExit(
                  "ERROR: GDRIVE_SERVICE_ACCOUNT_JSON "
                  "is not valid JSON: "
                  + str(exc)
              )


          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  service_account_info,
                  scopes=[
                      "https://www.googleapis.com/auth/drive",
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )


          sheets = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False
          )


          # ======================================================
          # INPUTS
          # ======================================================

          run_id = os.environ["RUN_ID"]
          topic = os.environ["TOPIC"]
          title = os.environ["TITLE"]

          folder_id = (
              os.environ.get(
                  "GDRIVE_FOLDER_ID",
                  ""
              ).strip()
          )

          spreadsheet_id = (
              os.environ["GOOGLE_SHEET_ID"]
              .strip()
          )


          # ======================================================
          # DRIVE UPLOAD
          # ======================================================

          metadata = {
              "name": f"{run_id}.mp4",
              "mimeType": "video/mp4"
          }


          # Folder ID is OPTIONAL.
          # If empty, upload goes to service-account Drive root.

          if folder_id:
              metadata["parents"] = [
                  folder_id
              ]

              print(
                  "Using configured Google Drive folder."
              )

          else:
              print(
                  "GDRIVE_FOLDER_ID not provided."
              )

              print(
                  "Uploading to service-account Drive root."
              )


          media = MediaFileUpload(
              "final-short.mp4",
              mimetype="video/mp4",
              resumable=True,
              chunksize=8 * 1024 * 1024
          )


          print(
              "Uploading final-short.mp4 to Google Drive..."
          )


          uploaded = (
              drive.files()
              .create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,webViewLink"
              )
              .execute()
          )


          file_id = uploaded["id"]


          print(
              "Drive upload succeeded:",
              file_id
          )


          # ======================================================
          # PUBLIC READ ACCESS
          # ======================================================

          try:

              drive.permissions().create(
                  fileId=file_id,
                  body={
                      "type": "anyone",
                      "role": "reader"
                  },
                  fields="id"
              ).execute()

              print(
                  "Drive public sharing succeeded."
              )

          except Exception as exc:

              print(
                  "WARNING: Could not make Drive file public."
              )

              print(exc)

              print(
                  "Upload itself succeeded."
              )


          link = (
              f"https://drive.google.com/file/d/"
              f"{file_id}/view"
          )


          # ======================================================
          # GOOGLE SHEETS
          # ======================================================

          sheet_range = (
              os.environ.get(
                  "GOOGLE_SHEET_RANGE",
                  ""
              ).strip()
              or
              "Sheet1!A:F"
          )


          row = [[
              datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),

              run_id,

              title,

              topic,

              "DONE",

              link
          ]]


          print(
              "Appending successful render to Google Sheets..."
          )


          (
              sheets.spreadsheets()
              .values()
              .append(
                  spreadsheetId=spreadsheet_id,
                  range=sheet_range,
                  valueInputOption="USER_ENTERED",
                  insertDataOption="INSERT_ROWS",
                  body={
                      "values": row
                  }
              )
              .execute()
          )


          print(
              "Google Sheets append succeeded."
          )


          # ======================================================
          # MACHINE READABLE OUTPUT
          # ======================================================

          print("")
          print(
              "VIDEO_URL:",
              link
          )

          print(
              "UPLOAD_STATUS: SUCCESS"
          )

          print(
              "SHEETS_STATUS: SUCCESS"
          )

          print(
              "RENDER_PIPELINE_STATUS: SUCCESS"
          )

          PY


