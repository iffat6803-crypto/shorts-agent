name: Render Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run ID"
        required: true
        type: string
      topic:
        description: "Video topic"
        required: true
        type: string
      script:
        description: "Complete narration script"
        required: true
        type: string
      title:
        description: "Video title"
        required: true
        type: string
      visuals:
        description: "JSON array of per-section visual assets"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pip
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir \
            "kokoro>=0.9.4" \
            soundfile \
            numpy \
            torch \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Verify Python packages
        run: |
          python3 - <<'PY'
          import sys
          import numpy
          import soundfile
          import torch
          import kokoro

          print("Python:", sys.version)
          print("numpy:", numpy.__version__)
          print("soundfile:", soundfile.__version__)
          print("torch:", torch.__version__)
          print("kokoro:", getattr(kokoro, "__version__", "installed"))
          PY

      - name: Show received inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
        run: |
          echo "Run ID: $RUN_ID"
          echo "Topic: $TOPIC"
          echo "Title: $TITLE"
          echo "Script words: $(printf '%s' "$SCRIPT" | wc -w)"

      - name: Render Short
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}

        run: |
          cat > render.py <<'PY'
          import json
          import math
          import os
          import pathlib
          import re
          import subprocess
          import urllib.request
          import numpy as np
          import soundfile as sf

          from kokoro import KPipeline

          OUT = pathlib.Path("out")
          OUT.mkdir(parents=True, exist_ok=True)

          SCRIPT = os.environ.get("SCRIPT", "").strip()
          VISUALS_RAW = os.environ.get("VISUALS_JSON", "").strip()

          if not SCRIPT:
              raise SystemExit("ERROR: SCRIPT is empty")

          try:
              visuals = json.loads(VISUALS_RAW)
          except Exception as exc:
              raise SystemExit(f"ERROR: VISUALS is not valid JSON: {exc}")

          if isinstance(visuals, dict):
              visuals = (
                  visuals.get("visuals")
                  or visuals.get("sections")
                  or [visuals]
              )

          if not isinstance(visuals, list):
              raise SystemExit("ERROR: VISUALS must be a JSON array")

          print("Visual assets supplied:", len(visuals))

          def get_url(item):
              if not isinstance(item, dict):
                  return None

              # Accept all formats currently used by the n8n pipeline.
              for key in (
                  "video_url",
                  "url",
                  "video",
                  "video_link",
                  "link",
                  "image_url",
                  "image",
                  "image_link",
                  "thumbnail",
              ):
                  value = item.get(key)

                  if isinstance(value, str):
                      value = value.strip()

                      if value.startswith("https://") or value.startswith("http://"):
                          return value

              return None

          usable = []

          for item in visuals:
              url = get_url(item)

              if url:
                  usable.append({
                      "url": url,
                      "narration": str(
                          item.get("narration")
                          or item.get("text")
                          or ""
                      ).strip()
                  })

          if not usable:
              raise SystemExit(
                  "ERROR: No usable visual URLs were supplied"
              )

          # ------------------------------------------------------------
          # DOWNLOAD VISUALS
          # ------------------------------------------------------------

          downloaded = []

          for i, item in enumerate(usable[:12]):

              url = item["url"]

              for attempt in range(1, 4):

                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          data = response.read()

                          content_type = (
                              response.headers.get(
                                  "Content-Type",
                                  ""
                              ).lower()
                          )

                      if not data:
                          raise RuntimeError("Empty response")

                      clean_url = url.lower().split("?")[0]

                      is_image = (
                          "image/" in content_type
                          or clean_url.endswith(
                              (
                                  ".jpg",
                                  ".jpeg",
                                  ".png",
                                  ".webp"
                              )
                          )
                      )

                      extension = ".jpg" if is_image else ".mp4"

                      path = OUT / f"source_{i}{extension}"

                      path.write_bytes(data)

                      downloaded.append({
                          "path": path,
                          "kind": "image" if is_image else "video",
                          "narration": item["narration"]
                      })

                      print(
                          f"Visual {i}: downloaded "
                          f"{extension} "
                          f"({path.stat().st_size} bytes)"
                      )

                      break

                  except Exception as exc:

                      print(
                          f"Visual {i}: "
                          f"attempt {attempt} failed: {exc}"
                      )

              else:

                  print(
                      f"Visual {i}: skipped after 3 attempts"
                  )

          if not downloaded:
              raise SystemExit(
                  "ERROR: No visual assets could be downloaded"
              )

          # ------------------------------------------------------------
          # KOKORO TTS
          # ------------------------------------------------------------

          print("Generating narration with Kokoro...")

          pipeline = KPipeline(lang_code="a")

          chunks = []

          for _, _, audio in pipeline(
              SCRIPT,
              voice="af_heart",
              speed=1.0
          ):

              audio = np.asarray(
                  audio,
                  dtype=np.float32
              ).reshape(-1)

              if audio.size:
                  chunks.append(audio)

          if not chunks:
              raise SystemExit(
                  "ERROR: Kokoro produced no audio"
              )

          SAMPLE_RATE = 24000

          audio = np.concatenate(chunks)

          original_duration = (
              len(audio) / SAMPLE_RATE
          )

          print(
              f"Original narration duration: "
              f"{original_duration:.2f}s"
          )

          audio_path = OUT / "voice.wav"

          # ------------------------------------------------------------
          # AUDIO LENGTH
          #
          # Minimum 30 seconds.
          # Maximum 60 seconds.
          #
          # IMPORTANT:
          # We NEVER use atempo to stretch a short narration.
          # Short narration gets silence at the END.
          # ------------------------------------------------------------

          if original_duration < 30:

              padding_seconds = (
                  30.0 - original_duration
              )

              padding_samples = int(
                  math.ceil(
                      padding_seconds * SAMPLE_RATE
                  )
              )

              audio = np.pad(
                  audio,
                  (0, padding_samples)
              )

              sf.write(
                  audio_path,
                  audio,
                  SAMPLE_RATE
              )

              final_audio_duration = (
                  len(audio) / SAMPLE_RATE
              )

              print(
                  f"Narration shorter than 30s. "
                  f"Added {padding_seconds:.2f}s silence."
              )

          elif original_duration <= 60:

              sf.write(
                  audio_path,
                  audio,
                  SAMPLE_RATE
              )

              final_audio_duration = (
                  original_duration
              )

          else:

              # Only speed up narration when it is genuinely
              # longer than the 60-second maximum.

              sf.write(
                  OUT / "voice_original.wav",
                  audio,
                  SAMPLE_RATE
              )

              factor = (
                  original_duration / 59.5
              )

              factor = max(
                  1.01,
                  min(factor, 2.0)
              )

              filter_chain = (
                  f"atempo={factor:.6f}"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(
                          OUT / "voice_original.wav"
                      ),
                      "-af",
                      filter_chain,
                      "-ar",
                      str(SAMPLE_RATE),
                      "-ac",
                      "1",
                      "-c:a",
                      "pcm_s16le",
                      str(audio_path)
                  ],
                  check=True
              )

              final_audio_duration = float(
                  subprocess.check_output(
                      [
                          "ffprobe",
                          "-v",
                          "error",
                          "-show_entries",
                          "format=duration",
                          "-of",
                          "default=noprint_wrappers=1:nokey=1",
                          str(audio_path)
                      ],
                      text=True
                  ).strip()
              )

              print(
                  f"Narration normalized to "
                  f"{final_audio_duration:.2f}s"
              )

          # ------------------------------------------------------------
          # SECTION TIMING
          # ------------------------------------------------------------

          sentences = [
              s.strip()
              for s in re.split(
                  r"(?<=[.!?])\s+",
                  SCRIPT
              )
              if s.strip()
          ]

          if not sentences:
              sentences = [SCRIPT]

          weights = []

          for sentence in sentences:
              count = len(
                  re.findall(
                      r"\b[\w'-]+\b",
                      sentence
                  )
              )

              weights.append(
                  max(1, count)
              )

          total_weight = sum(weights)

          section_durations = [
              final_audio_duration
              * weight
              / total_weight
              for weight in weights
          ]

          # Map sections across the available visuals.
          visual_count = len(downloaded)

          assignments = []

          for i, duration in enumerate(
              section_durations
          ):

              visual_index = min(
                  i,
                  visual_count - 1
              )

              assignments.append(
                  (
                      downloaded[visual_index],
                      duration
                  )
              )

          # ------------------------------------------------------------
          # VISUAL SEGMENTS
          # ------------------------------------------------------------

          segments = []

          for i, (item, duration) in enumerate(
              assignments
          ):

              source = item["path"]

              segment = (
                  OUT / f"segment_{i:02d}.mp4"
              )

              video_filter = (
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "setsar=1"
              )

              if item["kind"] == "video":

                  command = [
                      "ffmpeg",
                      "-y",
                      "-stream_loop",
                      "-1",
                      "-i",
                      str(source),
                      "-t",
                      f"{duration:.3f}",
                      "-vf",
                      video_filter,
                      "-an",
                      "-r",
                      "30",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "24",
                      "-pix_fmt",
                      "yuv420p",
                      str(segment)
                  ]

              else:

                  command = [
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      str(source),
                      "-t",
                      f"{duration:.3f}",
                      "-vf",
                      video_filter,
                      "-an",
                      "-r",
                      "30",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "24",
                      "-pix_fmt",
                      "yuv420p",
                      str(segment)
                  ]

              print(
                  "Creating visual segment:",
                  i
              )

              subprocess.run(
                  command,
                  check=True
              )

              segments.append(segment)

          if not segments:
              raise SystemExit(
                  "ERROR: No visual segments created"
              )

          concat_file = (
              OUT / "segments.txt"
          )

          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:

              for segment in segments:

                  f.write(
                      f"file '{segment.resolve()}'\n"
                  )

          visuals_video = (
              OUT / "visuals.mp4"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-an",
                  "-c",
                  "copy",
                  str(visuals_video)
              ],
              check=True
          )

          # ------------------------------------------------------------
          # SUBTITLES
          #
          # Bottom safe zone.
          # Small chunks.
          # Never center screen.
          # ------------------------------------------------------------

          def timestamp(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours, remainder = divmod(
                  total_ms,
                  3600000
              )

              minutes, remainder = divmod(
                  remainder,
                  60000
              )

              seconds_int, milliseconds = divmod(
                  remainder,
                  1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{seconds_int:02d},"
                  f"{milliseconds:03d}"
              )

          def caption_chunks(text):

              words = text.split()

              chunks = []

              current = []

              for word in words:

                  candidate = (
                      " ".join(
                          current + [word]
                      )
                  )

                  if current and (
                      len(current) >= 5
                      or len(candidate) > 34
                  ):

                      chunks.append(
                          " ".join(current)
                      )

                      current = [word]

                  else:

                      current.append(word)

              if current:
                  chunks.append(
                      " ".join(current)
                  )

              return chunks

          caption_units = []

          for sentence in sentences:

              parts = caption_chunks(
                  sentence
              )

              if not parts:
                  parts = [sentence]

              for part in parts:
                  count = len(
                      re.findall(
                          r"\b[\w'-]+\b",
                          part
                      )
                  )

                  caption_units.append(
                      (
                          part,
                          max(1, count)
                      )
                  )

          caption_weight = sum(
              weight
              for _, weight
              in caption_units
          )

          srt_path = (
              OUT / "captions.srt"
          )

          current_time = 0.0

          with srt_path.open(
              "w",
              encoding="utf-8"
          ) as f:

              for index, (
                  caption,
                  weight
              ) in enumerate(
                  caption_units,
                  1
              ):

                  duration = (
                      final_audio_duration
                      * weight
                      / caption_weight
                  )

                  start = current_time

                  end = min(
                      final_audio_duration,
                      current_time + duration
                  )

                  f.write(
                      f"{index}\n"
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                      f"{caption}\n\n"
                  )

                  current_time = end

          # ------------------------------------------------------------
          # FINAL VIDEO
          # ------------------------------------------------------------

          final = pathlib.Path(
              "final-short.mp4"
          )

          subtitle_filter = (
              f"subtitles={srt_path}:"
              "force_style="
              "'FontName=DejaVu Sans,"
              "FontSize=20,"
              "Bold=1,"
              "PrimaryColour=&H00FFFFFF,"
              "OutlineColour=&H00000000,"
              "BorderStyle=1,"
              "Outline=3,"
              "Shadow=0,"
              "Alignment=2,"
              "MarginV=220'"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(visuals_video),
                  "-i",
                  str(audio_path),
                  "-vf",
                  subtitle_filter,
                  "-t",
                  f"{final_audio_duration:.3f}",
                  "-map",
                  "0:v:0",
                  "-map",
                  "1:a:0",
                  "-r",
                  "30",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",
                  "-movflags",
                  "+faststart",
                  str(final)
              ],
              check=True
          )

          # ------------------------------------------------------------
          # FINAL VALIDATION
          # ------------------------------------------------------------

          duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(final)
                  ],
                  text=True
              ).strip()
          )

          size = final.stat().st_size

          print(
              f"Final duration: {duration:.2f}s"
          )

          print(
              f"Final size: {size} bytes"
          )

          if size <= 0:
              raise SystemExit(
                  "ERROR: final-short.mp4 is empty"
              )

          if duration < 29.5:
              raise SystemExit(
                  f"ERROR: final video too short: "
                  f"{duration:.2f}s"
              )

          if duration > 60.5:
              raise SystemExit(
                  f"ERROR: final video too long: "
                  f"{duration:.2f}s"
              )

          print(
              "VIDEO READY:",
              final.resolve()
          )

          PY

          python3 render.py

      - name: Upload MP4 to Google Drive and append Sheet row
        if: success()
        continue-on-error: true

        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}

        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import sys

          required = [
              "GDRIVE_SERVICE_ACCOUNT_JSON",
              "GDRIVE_FOLDER_ID",
              "GOOGLE_SHEET_ID"
          ]

          missing = [
              name
              for name in required
              if not os.environ.get(name)
          ]

          if missing:

              print(
                  "WARNING: Missing Google secrets:",
                  ", ".join(missing)
              )

              print(
                  "Skipping Drive/Sheets upload."
              )

              sys.exit(0)

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  json.loads(
                      os.environ[
                          "GDRIVE_SERVICE_ACCOUNT_JSON"
                      ]
                  ),
                  scopes=[
                      "https://www.googleapis.com/auth/drive",
                      "https://www.googleapis.com/auth/spreadsheets"
                  ]
              )
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          sheets = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False
          )

          run_id = os.environ["RUN_ID"]
          topic = os.environ["TOPIC"]
          title = os.environ["TITLE"]

          metadata = {
              "name": f"{run_id}.mp4",
              "parents": [
                  os.environ["GDRIVE_FOLDER_ID"]
              ],
              "mimeType": "video/mp4"
          }

          media = MediaFileUpload(
              "final-short.mp4",
              mimetype="video/mp4",
              resumable=True,
              chunksize=8 * 1024 * 1024
          )

          uploaded = (
              drive.files()
              .create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,webViewLink"
              )
              .execute()
          )

          file_id = uploaded["id"]

          link = (
              uploaded.get("webViewLink")
              or
              f"https://drive.google.com/file/d/{file_id}/view"
          )

          try:

              drive.permissions().create(
                  fileId=file_id,
                  body={
                      "type": "anyone",
                      "role": "reader"
                  },
                  fields="id"
              ).execute()

              link = (
                  f"https://drive.google.com/file/d/"
                  f"{file_id}/view"
              )

          except Exception as exc:

              print(
                  "WARNING: Could not enable public "
                  "Drive sharing:",
                  exc
              )

          sheet_range = (
              os.environ.get(
                  "GOOGLE_SHEET_RANGE"
              )
              or
              "Sheet1!A:F"
          )

          row = [[
              datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),

              run_id,

              title,

              topic,

              "DONE",

              link
          ]]

          (
              sheets.spreadsheets()
              .values()
              .append(
                  spreadsheetId=os.environ[
                      "GOOGLE_SHEET_ID"
                  ],
                  range=sheet_range,
                  valueInputOption="USER_ENTERED",
                  insertDataOption="INSERT_ROWS",
                  body={
                      "values": row
                  }
              )
              .execute()
          )

          print(
              "VIDEO_URL:",
              link
          )

          PY

      - name: Upload GitHub artifact backup
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: final-short-${{ github.run_id }}

          path: |
            final-short.mp4
            out/voice.wav
            out/captions.srt

          if-no-files-found: warn

          retention-days: 7
