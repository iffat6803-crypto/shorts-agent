name: Render Short

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      topic:
        required: true
        type: string
      script:
        required: true
        type: string
      title:
        required: true
        type: string
      visuals:
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install "kokoro>=0.9.4" soundfile torch google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Render video
        env:
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          VISUALS_JSON: ${{ inputs.visuals }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess, urllib.request, pathlib, re, textwrap
          from kokoro import KPipeline
          import soundfile as sf

          out = pathlib.Path("out")
          out.mkdir(exist_ok=True)
          script = os.environ["SCRIPT"]
          visuals = json.loads(os.environ["VISUALS_JSON"])

          # Download up to 8 portrait clips; failed downloads are skipped.
          media=[]
          for i,v in enumerate(visuals[:8]):
              try:
                  p=out/f"clip_{i}.mp4"
                  urllib.request.urlretrieve(v["url"], p)
                  media.append(p)
              except Exception as e:
                  print("visual download failed", i, e)

          if not media:
              raise SystemExit("No visual assets downloaded")

          # Kokoro local/cloud-runner TTS: no paid TTS API.
          pipe=KPipeline(lang_code="a")
          chunks=[]
          for i,(gs,ps,audio) in enumerate(pipe(script, voice="af_heart")):
              p=out/f"voice_{i}.wav"
              sf.write(p, audio, 24000)
              chunks.append(p)

          with open(out/"voice_list.txt","w") as f:
              for p in chunks:
                  f.write(f"file '{p.resolve()}'\n")

          subprocess.run(["ffmpeg","-y","-f","concat","-safe","0","-i",str(out/"voice_list.txt"),
                          "-c","copy",str(out/"voice.wav")],check=True)

          # Build a 45-60s portrait montage. Clips are looped/truncated by ffmpeg.
          with open(out/"media_list.txt","w") as f:
              for p in media:
                  f.write(f"file '{p.resolve()}'\n")

          subprocess.run(["ffmpeg","-y","-stream_loop","-1","-f","concat","-safe","0",
                          "-i",str(out/"media_list.txt"),"-t","60",
                          "-vf","scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920",
                          "-an","-c:v","libx264","-pix_fmt","yuv420p",str(out/"visuals.mp4")],check=True)

          # Basic subtitle timing based on script words.
          words=re.findall(r"\S+",script)
          n=len(words)
          lines=[]
          for i in range(0,n,5):
              lines.append(" ".join(words[i:i+5]))
          duration=60.0
          step=duration/max(1,len(lines))
          srt=[]
          for i,line in enumerate(lines):
              a=i*step; b=min(duration,(i+1)*step)
              def ts(x):
                  h=int(x//3600); m=int((x%3600)//60); sec=int(x%60); ms=int((x-int(x))*1000)
                  return f"{h:02d}:{m:02d}:{sec:02d},{ms:03d}"
              srt += [str(i+1),f"{ts(a)} --> {ts(b)}",line,""]
          (out/"captions.srt").write_text("\n".join(srt),encoding="utf-8")

          final=out/"short.mp4"
          subprocess.run(["ffmpeg","-y","-i",str(out/"visuals.mp4"),"-i",str(out/"voice.wav"),
                          "-vf",f"subtitles={out/'captions.srt'}:force_style='FontName=Arial,FontSize=18,Bold=1,Outline=3,Shadow=1,MarginV=220'",
                          "-map","0:v:0","-map","1:a:0","-t","60",
                          "-c:v","libx264","-preset","veryfast","-crf","22","-c:a","aac","-b:a","128k",
                          "-shortest",str(final)],check=True)
          print("VIDEO:", final)
          PY

      - name: Upload MP4 to Google Drive and append Sheet row
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          RUN_ID: ${{ inputs.run_id }}
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}
        run: |
          python3 - <<'PY'
          import os, json, datetime
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/drive","https://www.googleapis.com/auth/spreadsheets"]
          )
          drive=build("drive","v3",credentials=creds)
          sheets=build("sheets","v4",credentials=creds)

          meta={"name":f"{os.environ['RUN_ID']}.mp4",
                "parents":[os.environ["GDRIVE_FOLDER_ID"]]}
          media=MediaFileUpload("out/short.mp4",mimetype="video/mp4",resumable=True)
          file=drive.files().create(body=meta,media_body=media,fields="id,webViewLink").execute()

          row=[[datetime.datetime.now(datetime.timezone.utc).isoformat(),
                os.environ["RUN_ID"],os.environ["TITLE"],os.environ["TOPIC"],"DONE",file.get("webViewLink","")]]
          sheets.spreadsheets().values().append(
              spreadsheetId=os.environ["GOOGLE_SHEET_ID"],
              range=os.environ["GOOGLE_SHEET_RANGE"] or "Sheet1!A:F",
              valueInputOption="USER_ENTERED",
              body={"values":row}
          ).execute()
          print(file.get("webViewLink",""))
          PY
