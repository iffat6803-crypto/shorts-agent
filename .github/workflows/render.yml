name: Pexels Test

on:
  workflow_dispatch:

jobs:
  pexels:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ffmpeg

      - name: Search Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          curl -fL \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/v1/videos/search?query=space%20science&orientation=portrait&size=medium&per_page=5" \
            -o pexels.json

          python - <<'PY'
          import json

          d = json.load(open("pexels.json"))
          videos = d.get("videos", [])

          if not videos:
              raise SystemExit("ERROR: Pexels returned no videos")

          print("PEXELS API: OK")
          print("Videos found:", len(videos))

          v = videos[0]
          files = [f for f in v.get("video_files", []) if f.get("link")]

          if not files:
              raise SystemExit("ERROR: No video download URL")

          f = max(files, key=lambda x: x.get("width", 0) * x.get("height", 0))

          print("Download URL found")
          print("Resolution:", f.get("width"), "x", f.get("height"))
          print("Duration:", v.get("duration"))

          open("video_url.txt", "w").write(f["link"])
          PY

      - name: Download video
        run: |
          curl -fL --retry 3 \
            "$(cat video_url.txt)" \
            -o pexels-test.mp4

      - name: Validate video
        run: |
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            pexels-test.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: pexels-test-video
          path: pexels-test.mp4
