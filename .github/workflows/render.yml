  - name: Validate final video
    run: |
      DURATION=$(ffprobe -v error \
        -show_entries format=duration \
        -of default=noprint_wrappers=1:nokey=1 final-short.mp4)

      echo "Final duration: ${DURATION} seconds"

      python - "$DURATION" <<'PY'
      import sys

      duration = float(sys.argv[1])

      if duration < 30:
          raise SystemExit(
              f"ERROR: Video is only {duration:.2f}s. Minimum is 30s."
          )

      if duration > 60:
          raise SystemExit(
              f"ERROR: Video is {duration:.2f}s. Maximum is 60s."
          )

      print(f"Video duration valid: {duration:.2f}s")
      PY

      ffprobe -v error \
        -show_entries format=duration,size \
        -of default=noprint_wrappers=1 \
        final-short.mp4

      test -s final-short.mp4
